<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Fabrikprüfung Schema Test</title><script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "ManufacturingBusiness", "@id": "https://www.wowohcool.com/#organization", "name": "WOWOHCOOL", "areaServed": ["DE", "AT", "CH", "EU"]}, {"@type": "WebSite", "@id": "https://www.wowohcool.com/#website"}, {"@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Startseite", "item": "https://www.wowohcool.com/de/"}, {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.wowohcool.com/de/blog/"}, {"@type": "ListItem", "position": 3, "name": "Fabrikprüfung China", "item": "https://www.wowohcool.com/de/blog/fabrikpruefung-checkliste-importeure/"}]}, {"@type": "BlogPosting", "headline": "Fabrikprüfung in China: Komplette Checkliste 2026", "author": {"@type": "Person", "name": "Snowy May", "url": "https://www.linkedin.com/in/snowy-wireless-charger"}, "datePublished": "2026-05-27", "dateModified": "2026-06-24", "inLanguage": "de-DE", "speakable": {"@type": "SpeakableSpecification", "cssSelector": [".speakable"]}, "mainEntityOfPage": {"@type": "WebPage", "@id": "https://www.wowohcool.com/de/blog/fabrikpruefung-checkliste-importeure/"}, "publisher": {"@id": "https://www.wowohcool.com/#organization"}}, {"@type": "Person", "name": "Snowy May", "jobTitle": "Market Manager"}, {"@type": "HowTo", "name": "Fabrik in China prüfen: 10-Schritte-Audit", "description": "Strukturierte Anleitung zur Prüfung eines chinesischen Herstellers vor der Erstbestellung - von Dokumenten bis externem Audit.", "totalTime": "PT5H", "step": [{"@type": "HowToStep", "position": 1, "name": "Geschäftslizenz anfordern und über NECIPS verifizieren", "text": "Lassen Sie sich die chinesische Business License zusenden und prüfen Sie Eintragungsdatum, Geschäftsumfang und Adresse über gsxt.gov.cn."}, {"@type": "HowToStep", "position": 2, "name": "ISO 9001 Zertifikat über IAF CertSearch prüfen", "text": "Geben Sie die Zertifikatsnummer auf certsearch.iaf.ru ein und prüfen Sie Aussteller, Akkreditierungsstelle (CNAS), Geltungsbereich und Ablaufdatum."}, {"@type": "HowToStep", "position": 3, "name": "Produktionsfläche und Mitarbeiterzahl verifizieren", "text": "Mindestens 5.000 m² Produktionsfläche und 200-500 Mitarbeiter sind Standard. Lassen Sie sich die Aufteilung Produktion, QC, R&D und Verwaltung zeigen."}, {"@type": "HowToStep", "position": 4, "name": "SMT-Linien und Fertigungstiefe bewerten", "text": "Anzahl SMT-Linien, Hersteller (Yamaha, Panasonic), tägliche Bestückungsleistung und Fertigungstiefe (PCB- und Gehäusefertigung in-house)."}, {"@type": "HowToStep", "position": 5, "name": "4-stufigen QC-Prozess (IQC/IPQC/FQC/OQC) prüfen", "text": "Lassen Sie sich Prüfprotokolle, AQL-Werte und 8D-Reports zeigen. Standard: AQL 2.5 für Major Defects, AQL 1.0 für kritische Fehler."}, {"@type": "HowToStep", "position": 6, "name": "Aging-Test und Qualitätskennzahlen anfordern", "text": "4-Stunden-Aging-Test für 100 Prozent der Einheiten. Defektrate unter 0,3 Prozent (3.000 DPPM) ist akzeptabel. First Pass Yield über 98 Prozent."}, {"@type": "HowToStep", "position": 7, "name": "Europäische Referenzkunden kontaktieren", "text": "Mindestens 3 Referenzen aus DE oder EU anfordern und nach Liefertreue, Qualitätskonstanz und Reklamationsbearbeitung fragen."}, {"@type": "HowToStep", "position": 8, "name": "Videobesichtigung durchführen", "text": "60-90 Minuten Live-Rundgang während chinesischer Produktionszeit (9:00-17:00 UTC+8). Spontane Detailaufnahmen anfordern."}, {"@type": "HowToStep", "position": 9, "name": "Externen Auditor beauftragen", "text": "Bei Bestellwerten über 20.000 EUR Factory Audit und PSI durch SGS, TÜV Rheinland oder Bureau Veritas (Kosten: 300-600 EUR pro Tag)."}, {"@type": "HowToStep", "position": 10, "name": "Sozialaudit-Status prüfen (BSCI/Sedex)", "text": "Für EU-Markenkunden BSCI- oder Sedex-SMETA-Zertifizierung anfordern. Pflicht ab 2027 für CSDDD-pflichtige Importeure."}]}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Wie prüfe ich eine Fabrik in China ohne zu reisen?", "acceptedAnswer": {"@type": "Answer", "text": "Vereinbaren Sie eine 60-90-minütige Videobesichtigung der Produktion während chinesischer Arbeitszeit. Lassen Sie sich ISO 9001 Zertifikat, Referenzen und Mitarbeiterzahl zeigen. Beauftragen Sie bei grösseren Projekten eine externe Prüfung durch SGS oder TÜV Rheinland."}}, {"@type": "Question", "name": "Was kostet eine Fabrikprüfung in China?", "acceptedAnswer": {"@type": "Answer", "text": "Eine externe Inspektion durch SGS oder Bureau Veritas kostet 300-600 EUR pro Tag. Eine persönliche Reise nach Shenzhen kostet 1.500-3.500 EUR (Flug, Hotel, Verpflegung, Visum, Dolmetscher)."}}, {"@type": "Question", "name": "Was ist der Unterschied zwischen Factory Audit und Pre-Shipment Inspection?", "acceptedAnswer": {"@type": "Answer", "text": "Ein Factory Audit ist eine umfassende Erstprüfung der Fabrik vor der ersten Bestellung (Kapazität, QC-System, Arbeitsbedingungen). Eine Pre-Shipment Inspection (PSI) ist eine Stichprobenprüfung nach AQL, wenn mindestens 80 Prozent der Bestellung produziert und verpackt ist."}}, {"@type": "Question", "name": "Wie verifiziere ich ein ISO 9001 Zertifikat aus China?", "acceptedAnswer": {"@type": "Answer", "text": "Nutzen Sie die offizielle IAF CertSearch Datenbank unter certsearch.iaf.ru. Geben Sie die Zertifikatsnummer ein und prüfen Sie Aussteller, Akkreditierungsstelle (CNAS), Geltungsbereich und Ablaufdatum. Schätzungsweise 15-20 Prozent der auf Alibaba gezeigten ISO 9001 Zertifikate halten der Überprüfung nicht stand."}}, {"@type": "Question", "name": "Was sind die häufigsten Betrugsmuster bei Alibaba-Lieferanten?", "acceptedAnswer": {"@type": "Answer", "text": "Die häufigsten Muster sind: falsche UK/US-Briefkastenfirmen, gestohlene Produktbilder von anderen Anbietern, gefälschte CE/RoHS-Zertifikate, plötzliche Aufforderung zu einem neuen Bankkonto (Phishing-Angriff) sowie Mitarbeiterzahlen, die nicht mit NECIPS-Daten übereinstimmen."}}, {"@type": "Question", "name": "Wann brauche ich ein BSCI-Sozialaudit?", "acceptedAnswer": {"@type": "Answer", "text": "BSCI ist Pflicht für Lieferanten der grossen DE-Einzelhandelsketten (Aldi, Lidl, REWE) und ab 2027 implizit für CSDDD-pflichtige Importeure (1.000+ Mitarbeiter, 450+ Mio EUR Umsatz). Ein BSCI-Audit kostet 1.500-3.500 EUR und ist 2 Jahre gültig."}}, {"@type": "Question", "name": "Wem gehört das Spritzgusswerkzeug bei einer OEM-Produktion?", "acceptedAnswer": {"@type": "Answer", "text": "Wenn Sie die Werkzeugkosten (Tooling Fee) bezahlt haben, sollten Sie Eigentümer sein - sofern dies vertraglich (Mould Ownership Clause) geregelt ist. Ohne explizite Klausel gehört das Werkzeug nach chinesischem Recht der Fabrik. Tooling-Verlust bei Lieferantenwechsel kann 8.000-35.000 EUR pro Werkzeug kosten."}}, {"@type": "Question", "name": "Was bedeutet AQL 2.5 konkret?", "acceptedAnswer": {"@type": "Answer", "text": "AQL 2.5 erlaubt maximal 2,5 Prozent Major Defects in der Stichprobe. Bei einer Bestellung von 5.000 Einheiten werden 200 Stück zufällig geprüft - maximal 10 dürfen Major Defects aufweisen, sonst wird die gesamte Charge abgelehnt. Für Powerbanks ist AQL 2.5 für Hauptfehler und AQL 1.0 für sicherheitskritische Fehler Industriestandard."}}]}]}</script></head><body><h1>Fabrikprüfung in China: Komplette Checkliste 2026</h1><div class="speakable"><p>Schnellantwort placeholder for speakable test.</p></div></body></html>
