      - paragraph [ref=e59]: "Semi-solid-state batteries replace the liquid electrolyte in traditional Li-polymer cells with a gel or semi-solid electrolyte. This fundamentally changes three things: energy density, thermal stability, and form factor."
      - generic [ref=e60]:
        - generic [ref=e61]:
          - paragraph [ref=e62]: 50%
          - paragraph [ref=e63]: Thinner Profile
          - paragraph [ref=e64]: Same capacity, half the thickness. Gel electrolyte eliminates separator layers needed for liquid containment.
        - generic [ref=e65]:
          - paragraph [ref=e66]: 30%
          - paragraph [ref=e67]: Higher Energy Density
          - paragraph [ref=e68]: More watt-hours per gram. Enables 20000mAh in a form factor that previously held 15000mAh.
        - generic [ref=e69]:
          - paragraph [ref=e70]: 500+
          - paragraph [ref=e71]: Charge Cycles
