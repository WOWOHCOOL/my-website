            - heading "5. GaN V OEM/ODM Process" [level=2] [ref=e160]
            - paragraph [ref=e161]:
              - text: From spec to shipment, the GaN V OEM process follows a structured flow. Working with an experienced
              - link "GaN charger manufacturer like WOWOHCOOL" [ref=e162] [cursor=pointer]:
                - /url: /service
              - text: ", here's what to expect:"
            - generic [ref=e163]:
              - generic [ref=e164]:
                - 'heading "Step 1: Define Power Requirements" [level=3] [ref=e165]'
                - paragraph [ref=e166]: Determine target wattage (65W, 100W, 140W, or 240W), port configuration (single vs multi-port), and GaN FET selection based on your market positioning and BOM targets.
              - generic [ref=e167]:
                - 'heading "Step 2: PCBA Design & Prototyping" [level=3] [ref=e168]'
                - paragraph [ref=e169]: GaN V requires specialized PCB layout for high-frequency operation. Your supplier designs the PCBA with proper thermal management and EMI shielding. First samples typically ship in 3-7 days.
              - generic [ref=e170]:
                - 'heading "Step 3: Certification & Compliance" [level=3] [ref=e171]'
                - paragraph [ref=e172]:
                  - text: CE, FCC, UL, and Qi certification as needed. GaN V chargers require updated EMI/EMC testing due to higher switching frequencies. Your
                  - link "OEM/ODM partner" [ref=e173] [cursor=pointer]:
                    - /url: /service
                  - text: handles all certification submissions.
              - generic [ref=e174]:
                - 'heading "Step 4: Mass Production & QC" [level=3] [ref=e175]'
                - paragraph [ref=e176]: Standard lead time is 25-30 days after sample approval. QC includes IQC (component inspection), IPQC (in-process monitoring), FQC (functional test including PD handshake verification), and OQC (outgoing inspection with 4-hour aging test).
            - paragraph [ref=e177]: "MOQ for standard GaN V ODM models starts at 500 units. Custom OEM with tooling: 1,000-2,000 units. Total timeline from concept to first shipment: 16-23 weeks for custom OEM, 6-8 weeks for ODM."
