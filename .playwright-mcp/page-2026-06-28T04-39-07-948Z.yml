          - generic [ref=e112]:
            - heading "Qi2-Ladenischen (15W, MPP)" [level=3] [ref=e113]
            - paragraph [ref=e114]:
              - text: Bündig in Nachttische, Schreibtische oder Ablageflächen eingelassen.
              - link "Qi2 mit Magnetic Power Profile" [ref=e115] [cursor=pointer]:
