        - generic [ref=e212]:
          - heading "5. Wichtige Zertifizierungen für DACH" [level=2] [ref=e213]
          - paragraph [ref=e214]: "Hotelladegeräte laufen im Dauerbetrieb (24/7, 365 Tage) und werden von wechselnden Nutzern ohne Einweisung bedient. Ohne lückenlose Zertifizierung haften Sie als Betreiber bei Sach- oder Personenschaden. Diese Standards sind im DACH-Raum Pflicht:"
          - list [ref=e215]:
            - listitem [ref=e216]:
              - strong [ref=e217]: "CE-Kennzeichnung:"
              - text: Kombination aus Niederspannungsrichtlinie (LVD 2014/35/EU) und EMV (2014/30/EU). Ohne CE darf kein elektrisches Gerät in der EU in Verkehr gebracht werden.
            - listitem [ref=e218]:
              - strong [ref=e219]: "DIN EN 62368-1 / IEC 62368-1:"
              - text: Sicherheitsnorm für Audio-, Video-, IT- und Kommunikationsgeräte. Hat seit 2020 die ältere EN 60950 abgelöst. Pflicht für jedes Netzteil und jede Ladestation. Details im
              - link "Sicherheitsstandards-Leitfaden" [ref=e220] [cursor=pointer]:
                - /url: /de/blog/sicherheitsstandards-ladegeraete/
              - text: .
            - listitem [ref=e221]:
              - strong [ref=e222]: "RoHS 2011/65/EU:"
              - text: Beschränkung gefährlicher Stoffe. Besonders relevant für Hotels mit Nachhaltigkeitszertifizierung (Green Key, EU Ecolabel, GreenSign).
            - listitem [ref=e223]:
              - strong [ref=e224]: "UL 94 V-0 Brandschutzgehäuse:"
              - text: Selbstverlöschend innerhalb von 10 Sekunden. Für DACH-Hotels mit strengen Brandschutzauflagen (MBO §41) faktisch unverzichtbar.
            - listitem [ref=e225]:
              - strong [ref=e226]: "WPC Qi2-Zertifizierung:"
              - text: Empfohlen für alle kabellosen Hotelmodelle. Bestätigt MPP-Konformität und Interoperabilität. Praxisleitfaden in unserer
              - link "Qi2-Zertifizierung für Importeure" [ref=e227] [cursor=pointer]:
                - /url: /de/blog/qi2-zertifizierung-importeure/
              - text: .
            - listitem [ref=e228]:
              - strong [ref=e229]: "EAR-Registrierung (WEEE, Kategorie 16):"
              - text: Pflicht für jeden Importeur in Deutschland (
              - link "Stiftung EAR" [ref=e230] [cursor=pointer]:
                - /url: https://www.stiftung-ear.de/themenwelten/pflichten-hersteller/welche-pflichten-haben-hersteller-von-elektrogeraeten/
              - text: ). Bußgelder bis
              - strong [ref=e231]: 100.000 €
              - text: bei Verstoß.
          - paragraph [ref=e232]:
            - text: Vollständige EU-Compliance-Übersicht im
            - link "EU-Zertifizierungs-Leitfaden" [ref=e233] [cursor=pointer]:
              - /url: /de/blog/zertifizierungen-eu-markt/
            - text: . WOWOHCOOL liefert für jede Bestellung Konformitätserklärung, Prüfberichte und Datenblätter — bei DDP-Lieferung übernehmen wir die gesamte Zollabwicklung.
