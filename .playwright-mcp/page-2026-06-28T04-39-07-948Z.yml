            - text: (vormals BGV A3) verpflichtet zur regelmäßigen Prüfung aller elektrischen Betriebsmittel, inklusive aller in Gästezimmern verbauten Ladegeräte und Steckdosenleisten (
            - link "DGUV V3 Originaltext" [ref=e243] [cursor=pointer]:
