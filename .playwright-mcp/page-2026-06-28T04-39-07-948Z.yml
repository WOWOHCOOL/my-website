            - heading "Konferenzraum-Tischmodule" [level=3] [ref=e127]
            - paragraph [ref=e128]: "Für Tagungsräume und Business Center: Tischeinbau-Module mit 4-8 USB-C-Ports (je 65W PD), integriertem Kabelmanagement und optionalem HDMI-Anschluss. Bei einer Konferenz mit 12 Teilnehmern können alle Geräte gleichzeitig geladen werden, ohne Verlängerungskabel oder Adapter. Preisbereich 85-220 € pro Modul (OEM, ab 200 Stück)."
