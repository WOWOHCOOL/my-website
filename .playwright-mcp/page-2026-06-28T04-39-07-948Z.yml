              - text: — passt in bestehende Möbel ohne aufwendigen Umbau. Inkl. Fremdkörpererkennung (FOD) und Übertemperaturschutz bis 40 °C Umgebungstemperatur.
          - generic [ref=e117]:
            - heading "Nachttisch-Kombistationen (USB-C PD + Qi2 + Schuko)" [level=3] [ref=e118]
            - paragraph [ref=e119]:
              - text: "Die meistverkaufte Kategorie für 3- und 4-Sterne-Häuser. Typisches Setup: 1× Qi2-Pad (15W), 2× USB-C PD (je 30W), 1× USB-A QC 3.0 (18W), 1× Schuko-Steckdose. Gesamtleistung 100W. Eine einzige Station ersetzt drei Netzteile auf dem Nachttisch. Mehr zur Technologie im"
              - link "USB-C PD Schnellladen-Leitfaden" [ref=e120] [cursor=pointer]:
