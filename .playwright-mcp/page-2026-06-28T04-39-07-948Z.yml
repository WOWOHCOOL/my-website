          - generic [ref=e289]:
            - heading "OEM vs. ODM für Hotelketten" [level=3] [ref=e290]
            - paragraph [ref=e291]:
              - text: OEM-Branding (Logo auf Standardmodell) ist ab
              - strong [ref=e292]: 500 Einheiten
