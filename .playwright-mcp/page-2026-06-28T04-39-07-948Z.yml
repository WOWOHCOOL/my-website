            - paragraph [ref=e246]:
              - text: "In der Beherbergungsbranche gelten Hotelladegeräte als ortsveränderliche Betriebsmittel. Empfohlenes Prüfintervall:"
              - strong [ref=e247]: 6 bis 24 Monate
              - text: ", abhängig von Beanspruchung. Geprüft werden Sichtzustand, Schutzleiter, Isolationswiderstand und Funktion. Die Prüfung kann nur durch eine Elektrofachkraft oder eine elektrotechnisch unterwiesene Person erfolgen — typischer Kostenaufwand"
              - strong [ref=e248]: 3-8 € pro Gerät
              - text: .
          - generic [ref=e249]:
            - heading "Warum Qualität sich direkt rechnet" [level=3] [ref=e250]
            - paragraph [ref=e251]:
              - text: Bei einem Hotel mit 200 Zimmern und 2 Ladestationen pro Zimmer ergeben sich pro Prüfzyklus Kosten von
              - strong [ref=e252]: 1.200-3.200 €
              - text: ". Hochwertige Geräte mit niedriger Defektrate (WOWOHCOOL:"
              - strong [ref=e253]: < 0,1 % im ersten Jahr
              - text: ) reduzieren Ausfälle zwischen den Prüfzyklen und vermeiden teure Sonderprüfungen. Günstige B-Ware aus dem Graumarkt fällt häufiger durch die Prüfung und verursacht ungeplante Ersatzbeschaffungen mitten in der Saison.
          - generic [ref=e254]:
            - heading "Dokumentation & Versicherungsschutz" [level=3] [ref=e255]
            - paragraph [ref=e256]: Jede DGUV-V3-Prüfung muss dokumentiert werden (Prüfprotokoll, Plakette). Im Schadensfall verlangt die Versicherung den lückenlosen Nachweis — fehlt er, drohen Leistungskürzungen oder Regress. WOWOHCOOL liefert für jedes Hospitality-Modell eine maschinenlesbare Geräte-ID (Lasergravur), die sich in gängige Wartungssoftware wie LOGIK G3 oder ELEKTROmanager nahtlos einlesen lässt.
        - generic [ref=e258]:
          - heading "7. DSGVO & Datensicherheit der Ladestation" [level=2] [ref=e259]
          - paragraph [ref=e260]: "Mit dem Trend zu „smarten\" Hotelzimmern werden auch Ladestationen zunehmend mit Konnektivität ausgestattet — App-Anbindung, NFC-Pairing, Bluetooth-Lautsprecher-Integration, Nutzungstracking. Für Hoteliers entsteht damit eine bislang unterschätzte DSGVO-Pflicht:"
          - generic [ref=e261]:
            - 'heading "Reine Qi2-Induktionsladegeräte: DSGVO-neutral" [level=3] [ref=e262]'
            - paragraph [ref=e263]: Eine reine Qi2-Spule erkennt nur das Magnetfeld eines aufgelegten Geräts. Es werden keine personenbezogenen Daten erfasst — keine Geräte-ID, kein Standort, keine Nutzungsdauer. Diese Geräte sind aus DSGVO-Sicht unkritisch und brauchen weder Auftragsverarbeitungsvertrag (AVV) noch Datenschutz-Folgenabschätzung (DSFA).
          - generic [ref=e264]:
            - heading "Vorsicht bei „smarten\" Ladestationen" [level=3] [ref=e265]
            - paragraph [ref=e266]: "Sobald eine Ladestation Bluetooth, NFC, WLAN oder USB-Datenübertragung anbietet, können personenbezogene Daten anfallen (MAC-Adresse, Gerätename, Verbindungslogs). Dann gelten Art. 6 + 13 DSGVO: Sie brauchen eine Rechtsgrundlage, eine Information am Touchpoint und ggf. eine DSFA. Der Aufwand übersteigt häufig den Nutzen — für 95 % aller Hotels ist die reine Induktionslösung die saubere Wahl."
          - generic [ref=e267]:
            - 'heading "WOWOHCOOL-Designprinzip: Hospitality offline" [level=3] [ref=e268]'
            - paragraph [ref=e269]:
              - text: Unsere gesamte Hospitality-Serie ist bewusst
              - strong [ref=e270]: offline
              - text: konzipiert. Keine Funkschnittstelle, kein Datenport, keine Telemetrie. Was geladen wird, bleibt zwischen Gerät und Akku — was Sie als Hotelier vor unnötigen DSGVO-Risiken schützt. Datentechnisch ist eine WOWOHCOOL-Ladestation so unkritisch wie ein Föhn oder eine Schreibtischlampe.
        - generic [ref=e272]:
          - heading "8. OEM-Personalisierung mit Hotellogo" [level=2] [ref=e273]
          - paragraph [ref=e274]: Personalisierte Ladestationen verwandeln einen Gebrauchsgegenstand in ein Markenerlebnis. Gäste nehmen gebrandete Module als Zeichen von Professionalität wahr — ein Effekt, der sich in Bewertungen, Weiterempfehlungen und letztlich in der Direktbuchungsquote niederschlägt.
          - img "Premium Hotel-Ladestation in Champagner-Optik mit Lasergravur Hotellogo | WOWOHCOOL OEM Hospitality" [ref=e275]
          - generic [ref=e276]:
            - heading "Branding-Optionen" [level=3] [ref=e277]
            - list [ref=e278]:
