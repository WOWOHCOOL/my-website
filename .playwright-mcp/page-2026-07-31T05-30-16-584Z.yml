        - generic [ref=f17e139]:
          - heading "GaN I (2014) — el inicio del cambio" [level=2] [ref=f17e140]
          - paragraph [ref=f17e141]: Los primeros FET de GaN comerciales superaban marginalmente al silicio de la época. Su ventaja real era el potencial de miniaturización, pero el sobrecoste hacía difícil justificarlo en consumer electronics. Hoy GaN I está obsoleto para cargadores nuevos.
        - generic [ref=f17e142]:
          - heading "GaN II (2017) — primera adopción masiva" [level=2] [ref=f17e143]
          - paragraph [ref=f17e144]: "Anker fue pionera con sus PowerPort Atom 30W en 2018. La frecuencia de conmutación duplicada permitió transformadores 40% más pequeños. Mercado de prueba: aceptación del consumidor demostrada. Hoy se sigue usando en cargadores baratos de 20-30W donde el coste manda."
        - generic [ref=f17e145]:
          - heading "GaN III (2020) — el caballo de batalla actual" [level=2] [ref=f17e146]
          - paragraph [ref=f17e147]: La generación más usada en cargadores comerciales 2023-2026. Equilibrio óptimo entre coste y rendimiento. Cubre las potencias clave 65-140W con eficiencias del 92-94%. Para la mayoría de proyectos OEM, GaN III sigue siendo la opción más rentable.
        - generic [ref=f17e148]:
          - heading "GaN IV (2022) — premium para alta potencia" [level=2] [ref=f17e149]
          - paragraph [ref=f17e150]: Introdujo modo de conmutación >1 MHz con MOSFET integrados (System-on-Chip). Permitió cargadores 140W en formato verdaderamente compacto. Sobrecoste 15-20% sobre GaN III; se justifica solo en gama premium.
        - generic [ref=f17e151]:
          - heading "GaN V (2024) — la quinta generación" [level=2] [ref=f17e152]
          - paragraph [ref=f17e153]:
            - text: La diferencia de GaN V no es solo cuantitativa. Integra el driver y la lógica de protección en el mismo chip, eliminando componentes externos. Permite cargadores 240W PD 3.1 EPR en formato compacto y, sobre todo, cumple el
            - strong [ref=f17e154]: Reglamento UE de Diseño Ecológico 2025/2052
            - text: que exige consumo en espera <0,1W — umbral que muchos diseños de silicio no pueden alcanzar.
          - img "Cargador GaN V 67W OEM con pantalla digital y cable retráctil — quinta generación, >95% eficiencia, frecuencia >500 kHz, MOQ 500 uds para importadores | WOWOHCOOL" [ref=f17e155]
        - generic [ref=f17e156]:
          - heading "Cómo verificar la generación real de un cargador para importadores" [level=2] [ref=f17e157]
          - paragraph [ref=f17e158]: "Algunos fabricantes etiquetan cargadores con «GaN V» cuando en realidad usan GaN III mejorado. Tres formas de verificación:"
          - list [ref=f17e159]:
            - listitem [ref=f17e160]:
              - strong [ref=f17e161]: "Número de pieza del FET:"
              - text: Pide el datasheet. Los proveedores reales (Navitas, Infineon, Innoscience) etiquetan claramente la generación. Cualquier ambigüedad es señal de alerta.
            - listitem [ref=f17e162]:
              - strong [ref=f17e163]: "Frecuencia de conmutación medida:"
              - text: Un osciloscopio en el laboratorio confirma la frecuencia real del switch.
            - listitem [ref=f17e164]:
              - strong [ref=f17e165]: "Perfil térmico:"
              - text: GaN V opera a 65-75°C bajo plena carga; GaN III suele estar 5-10°C por encima. La diferencia es medible con un termógrafo.
        - generic [ref=f17e166]:
          - heading "Recomendación OEM por potencia para importadores" [level=2] [ref=f17e167]
          - list [ref=f17e168]:
            - listitem [ref=f17e169]:
              - strong [ref=f17e170]: "20-45W:"
              - text: silicio actual o GaN II. Sobrecoste GaN V no se amortiza.
            - listitem [ref=f17e171]:
              - strong [ref=f17e172]: "65W:"
              - text: GaN III es el óptimo. GaN V solo en gama premium.
            - listitem [ref=f17e173]:
              - strong [ref=f17e174]: "100W:"
              - text: GaN III o IV. GaN V con sobrecoste del 15-20%.
            - listitem [ref=f17e175]:
              - strong [ref=f17e176]: "140W:"
              - text: GaN IV o V. La generación V se está convirtiendo en estándar.
            - listitem [ref=f17e177]:
              - strong [ref=f17e178]: "240W PD 3.1 EPR:"
              - text: GaN V obligatorio. No hay alternativa viable.
      - generic [ref=f17e181]:
        - heading "Preguntas Frecuentes" [level=2] [ref=f17e182]
        - generic [ref=f17e183]:
          - generic [ref=f17e184]:
            - heading "¿Qué diferencia hay entre GaN I y GaN V?" [level=3] [ref=f17e185]
            - paragraph [ref=f17e186]: "GaN I (2014): frecuencia de conmutación 100-200 kHz, eficiencia 88%, similar a silicio mejorado. GaN V (2024): frecuencia 500 kHz-5 MHz, eficiencia >95%, 40% menor tamaño y 30°C más frío que el silicio. Cinco generaciones en una década con mejoras exponenciales."
          - generic [ref=f17e187]:
            - heading "¿Vale la pena pagar más por GaN V?" [level=3] [ref=f17e188]
            - paragraph [ref=f17e189]: Sí, para potencias >45W. Por debajo de 45W el sobrecoste del 20-35% no se justifica frente a silicio actual. A partir de 65W, el tamaño compacto y la eficiencia GaN V se traducen en menor coste logístico, menos devoluciones y precio premium en retail. Para 100W+, GaN V es prácticamente obligatorio para competir.
          - generic [ref=f17e190]:
            - heading "¿Quién fabrica los FET GaN reales?" [level=3] [ref=f17e191]
            - paragraph [ref=f17e192]: Los proveedores principales son Navitas (líder GaN III-V), Infineon (CoolGaN), GaN Systems (adquirida por Infineon), EPC (Efficient Power Conversion), Innoscience (china, líder en volumen) y Texas Instruments. WOWOHCOOL trabaja con Navitas e Innoscience como proveedores principales.
          - generic [ref=f17e193]:
            - heading "¿GaN tiene riesgo de obsolescencia rápida?" [level=3] [ref=f17e194]
            - paragraph [ref=f17e195]: Las generaciones avanzan, pero el GaN III-V actual (instalado desde 2022) seguirá siendo viable comercialmente hasta 2028-2029 según el roadmap de USB-IF y los principales OEM. Comprar GaN V en 2026 es invertir en la generación dominante de los próximos 3-4 años.
