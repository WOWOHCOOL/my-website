          - generic [ref=f17e52]: Español
        - paragraph [ref=f17e56]: El nitruro de galio (GaN) ha evolucionado en cinco generaciones desde su llegada al mercado comercial en 2014. Cada generación ha mejorado frecuencia de conmutación, eficiencia y densidad de potencia. Este artículo compara las cinco generaciones de GaN técnicamente para que importadores OEM hispanohablantes puedan decidir qué generación pedir y a qué precio.
      - img "Comparativa técnica de cinco generaciones de GaN I-V para importadores OEM — frecuencia de conmutación 100 kHz→5 MHz, eficiencia 88%→>95%, evolución de costes FET, aplicaciones por potencia | WOWOHCOOL" [ref=f17e58]
