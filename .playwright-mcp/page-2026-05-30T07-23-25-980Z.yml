        - paragraph [ref=e224]: "No todos los cargadores que se anuncian como \"Qi2\" están realmente certificados. Preste atención a los siguientes puntos:"
        - list [ref=e225]:
          - listitem [ref=e226]:
            - strong [ref=e227]: "Certificación falsa:"
