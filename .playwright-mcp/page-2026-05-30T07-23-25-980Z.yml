        - paragraph [ref=e136]: "La ventaja decisiva: Qi2 es compatible hacia atrás. Todos los dispositivos con soporte Qi pueden cargarse en cargadores Qi2 (con potencia estándar). Al mismo tiempo, los dispositivos más nuevos se benefician de mayores velocidades y mejor eficiencia. Esto convierte a Qi2 en la opción ideal para fabricantes que desean ofrecer una amplia gama de productos."
        - paragraph [ref=e137]: Otro aspecto importante es la seguridad. Qi2 incorpora mecanismos de protección mejorados contra sobrecalentamiento, FOD (Foreign Object Detection — detección de objetos extraños) y sobretensión. Esto es especialmente relevante para el mercado español y europeo, donde los consumidores valoran la seguridad de los productos.
      - generic [ref=e138]:
