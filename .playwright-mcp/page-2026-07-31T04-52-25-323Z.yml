          - paragraph [ref=e87]: KEY TAKEAWAYS
          - paragraph [ref=e88]:
            - text: "GaN (Gallium Nitride) chargers are 40-50% smaller and 30% cooler than silicon equivalents. For OEM buyers:"
            - strong [ref=e89]: GaN wins on cost, size, and suitability for consumer electronics
            - text: ", while SiC targets 500W+ industrial applications. GaN V technology delivers the best balance of performance, compactness, and margin. Power delivery follows the"
            - link "USB-IF PD 3.1 specification" [ref=e90] [cursor=pointer]:
              - /url: https://www.usb.org/document-library/usb-power-delivery
            - text: ", enabling up to 240W over a single USB-C cable."
          - list [ref=e91]:
            - listitem [ref=e92]:
              - strong [ref=e93]: GaN chargers deliver 40% smaller size and 30% less heat vs equivalent silicon chargers
              - text: ", with 93-95% efficiency at full load. For OEM brands, this means: smaller retail packaging (lower freight cost), fewer warranty returns (less heat = longer component life), and a premium price position (consumers pay 20-30% more for smaller/faster chargers)."
            - listitem [ref=e94]:
              - strong [ref=e95]: GaN V (2023) is the current production standard, not GaN I (2018)
              - text: ". GaN V uses 3 MHz switching frequency enabling 240W in a 65W-sized enclosure. GaN I chargers are being phased out as foundries shift capacity. Verify your supplier's GaN generation by requesting the FET part number in the BOM: Navitas NV6117/NV6138, Infineon IGI60F, or Innoscience INN650 = genuine GaN V."
            - listitem [ref=e96]:
              - strong [ref=e97]: FOB Shenzhen pricing for GaN chargers at MOQ 1,000
              - text: ": 30W ~$3.20-4.50, 65W ~$5.40-7.20, 100W ~$7.50-10.00, 140W ~$14.00-18.00. Prices declining 10-15% annually as GaN FET production scales. The 65W tier is the OEM volume sweet spot: highest demand, most competitive pricing, widest retail audience."
            - listitem [ref=e98]:
              - strong [ref=e99]: 3 supplier verification points before ordering GaN chargers
              - text: ": (1) request the GaN FET datasheet and cross-check the part number on the manufacturer's website (Navitas, Infineon, Innoscience all have public databases); (2) verify the factory owns their PCBA design or has a licensed reference design, not a copied layout; (3) request a 72-hour aging test report showing case temperature at 6 measurement points under 100% load."
