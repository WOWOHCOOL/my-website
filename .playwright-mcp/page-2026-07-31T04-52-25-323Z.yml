              - paragraph [ref=e596]: "At 65W: GaN BOM premium is $1-3/unit over silicon at 1,000-unit volume, a 15-25% premium. FOB Shenzhen pricing: 65W GaN $5.40-7.20/unit at 1,000 pcs, 100W $7.50-10.00/unit at 1,000 pcs. This premium is typically recovered through: 40% smaller packaging (lower freight), 0.3% vs 3.2% field return rates, and 40-60% higher retail margins. At 30W and below, silicon remains cost-competitive. Warning: prices significantly below these benchmarks mean compromised capacitors, thinner PCB copper, or non-compliant components. McKinsey data: companies ignoring compliance costs face 3-5× overruns vs initial unit price savings."
            - generic [ref=e597]:
              - heading "What thermal and component quality standards should OEM buyers demand for GaN chargers above 65W?" [level=3] [ref=e598]
              - paragraph [ref=e599]: "For any GaN charger above 65W, demand: (1) high-grade thermal potting compound injection, not bare PCBA assemblies, a 140W charger without potting traps ~8.4W of heat risking enclosure melt and thermal runaway; (2) 105°C-rated Japanese electrolytic capacitors (Rubycon, Nichicon); (3) planar magnetics (flat copper tracks in PCB) for heat dissipation at high frequencies; (4) 100% burn-in/aging testing for 4-24 hours at 40-50°C ambient, spot-checking is insufficient; (5) dynamic power allocation that renegotiates voltage safely when devices are plugged/unplugged, static allocation causes voltage drops and screen flickering. Field failure rate under 0.5% is competitive; under 0.3% is best-in-class."
