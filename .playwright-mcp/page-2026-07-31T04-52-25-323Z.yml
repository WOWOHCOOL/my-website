            - paragraph [ref=e173]: The performance gap between GaN V and silicon is now wide enough that the OEM sourcing decision is no longer "if" but "at what wattage." At 45W and above, GaN V's BOM premium ($1-3/unit) is recovered through freight savings, lower warranty costs, and premium retail positioning. Silicon remains viable only for sub-30W single-port chargers targeting the absolute entry-level price point, a segment with single-digit margins and limited brand differentiation potential.
