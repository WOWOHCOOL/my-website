        - generic [ref=e284]:
          - 'heading "7. GaN Semiconductor Fundamentals: What to Verify in Chip Sourcing" [level=2] [ref=e285]'
          - paragraph [ref=e286]: Understanding GaN technology doesn't require a degree in electrical engineering. Here's a simplified breakdown of how gallium nitride semiconductors revolutionize charging.
          - generic [ref=e287]:
            - generic [ref=e288]:
              - generic [ref=e289]: "1"
              - generic [ref=e290]:
                - heading "The Bandgap Advantage" [level=3] [ref=e291]
                - paragraph [ref=e292]: GaN has a bandgap of 3.4 eV compared to silicon's 1.1 eV. This fundamental property allows GaN devices to handle higher voltages and frequencies without breaking down. Think of it as the difference between a rubber band and a steel spring, one stretches and snaps, the other holds firm under pressure.
            - generic [ref=e293]:
              - generic [ref=e294]: "2"
              - generic [ref=e295]:
                - heading "Faster Switching, Less Heat" [level=3] [ref=e296]
                - paragraph [ref=e297]: "GaN transistors switch on and off up to 100x faster than silicon MOSFETs. This high-speed switching means energy spends less time in transition, resulting in minimal heat generation. The result: a charger that stays cool while delivering more power."
            - generic [ref=e298]:
              - generic [ref=e299]: "3"
              - generic [ref=e300]:
                - heading "Higher Electron Mobility" [level=3] [ref=e301]
                - paragraph [ref=e302]: Electrons move through GaN material approximately 30% faster than in silicon. This translates to lower resistance and less energy lost as heat. In technical terms, GaN achieves this while maintaining a smaller die size, hence the compact charger designs we see today.
            - generic [ref=e303]:
              - generic [ref=e304]: "4"
              - generic [ref=e305]:
                - heading "Zero Reverse Recovery Loss" [level=3] [ref=e306]
                - paragraph [ref=e307]: Unlike silicon diodes that experience "reverse recovery" losses when switching direction, GaN devices have negligible recovery losses. This is particularly beneficial in switched-mode power supplies where efficiency gains directly impact the charger's thermal performance.
          - paragraph [ref=e308]:
            - text: According to
            - link "Transphorm" [ref=e309] [cursor=pointer]:
              - /url: https://www.transphorm.com/
            - text: ", one of the leading GaN power semiconductor manufacturers, GaN enables power conversion efficiency exceeding 99% in certain applications."
        - generic [ref=e311]:
          - 'heading "8. GaN vs SiC (Silicon Carbide): Technology Choice for Your Product Line" [level=2] [ref=e312]'
          - paragraph [ref=e313]: Silicon carbide (SiC) is another wide-bandgap semiconductor gaining traction in power electronics. While both GaN and SiC outperform traditional silicon, they target fundamentally different market segments. Understanding where each technology excels helps OEM buyers avoid over-engineering costs.
          - paragraph [ref=e314]:
            - strong [ref=e315]: "SiC in brief:"
            - text: Silicon carbide excels in high-voltage, high-power applications above 200W. It is the dominant technology in EV onboard chargers (6.6-22kW), industrial power supplies, and server PSUs. SiC wafers cost 3-5x more than GaN equivalents, making it impractical for consumer-priced accessories.
          - table [ref=e317]:
            - rowgroup [ref=e318]:
              - row [ref=e319]:
                - columnheader "Specification" [ref=e320]
                - columnheader "GaN" [ref=e321]
                - columnheader "SiC" [ref=e322]
            - rowgroup [ref=e323]:
