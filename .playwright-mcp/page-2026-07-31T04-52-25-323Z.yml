          - paragraph [ref=e54]:
            - text: Gallium Nitride (GaN) has moved from premium novelty to industry standard in under three years. Two regulatory mandates, the
            - strong [ref=e55]:
              - link "EU Ecodesign Regulation (ESPR) effective November 2025" [ref=e56] [cursor=pointer]:
                - /url: https://commission.europa.eu/energy-climate-change-environment/standards-tools-and-labels/products-labelling-rules-and-requirements/sustainable-products/ecodesign-sustainable-products-regulation_en
            - text: and the
            - strong [ref=e57]:
              - link "EU Common Charger Directive (2022/2380/EU)" [ref=e58] [cursor=pointer]:
                - /url: https://eur-lex.europa.eu/eli/dir/2022/2380/oj
            - text: ", have made GaN the only practical semiconductor choice for any new charger design above 45W. For OEM brands, the question has shifted from \"should we use GaN?\" to \"which GaN generation and at what FOB cost?\""
          - paragraph [ref=e59]:
            - text: The GaN charger market reached
            - strong [ref=e60]:
              - link "$1.2 billion in 2026" [ref=e61] [cursor=pointer]:
                - /url: https://www.persistencemarketresearch.com/market-research/gan-chargers-market.asp
            - text: and is projected to hit
            - strong [ref=e62]: $6.0 billion by 2033
            - text: at a
            - strong [ref=e63]: 25.7% CAGR
            - text: (Persistence Market Research, April 2026). Europe is the fastest-growing region at
            - strong [ref=e64]: 30% CAGR
            - text: . GaN now accounts for over
            - strong [ref=e65]: 50% of chargers at 65W and above
            - text: ", with power IC costs dropping 8-12% annually, transitioning from premium niche to industry standard."
