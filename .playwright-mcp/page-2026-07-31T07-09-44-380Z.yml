      - generic [ref=f4e385]:
        - heading "5. Proceso OEM/ODM Paso a Paso" [level=2] [ref=f4e386]
        - heading "Fase 1 — Especificaciones Técnicas (2-3 Semanas)" [level=3] [ref=f4e387]
        - paragraph [ref=f4e388]: Define potencia objetivo (65W, 100W, 140W o 240W PD 3.1), número y tipo de puertos (USB-C + USB-A), formato (sobremesa, viaje, coche) y certificaciones objetivo según tu mercado (CE para UE, FCC para EE.UU., UKCA para Reino Unido). Un fabricante con experiencia te asesorará sobre qué combinaciones son técnicamente viables sin comprometer la disipación térmica.
        - heading "Fase 2 — Prototipado y Validación PCBA (3-4 Semanas)" [level=3] [ref=f4e389]
        - paragraph [ref=f4e390]:
          - text: Diseño del PCBA con FET GaN V, controlador PD 3.1 y componentes auxiliares. Se valida el rendimiento térmico a plena carga durante 4+ horas, el ripple noise (<200 mVp-p para cumplir especificación USB-IF) y la compatibilidad electromagnética (EMI/EMC). WOWOHCOOL entrega primeras muestras de ingeniería en
          - strong [ref=f4e391]: 3-7 días
          - text: para modelos basados en plataformas existentes.
        - heading "Fase 3 — Moldes de Carcasa (4-6 Semanas)" [level=3] [ref=f4e392]
        - paragraph [ref=f4e393]:
          - text: Diseño industrial y fabricación de moldes de inyección. El tamaño reducido del GaN V permite carcasas significativamente más compactas que el silicio. Especifica
          - strong [ref=f4e394]: materiales V0 autoextinguibles
          - text: (obligatorio para certificación de seguridad) y considera opciones de enchufes intercambiables EU/UK/US para distribución multi-país.
        - heading "Fase 4 — Certificación CE/FCC/UL (4-6 Semanas)" [level=3] [ref=f4e395]
        - paragraph [ref=f4e396]:
          - text: Presenta el producto a laboratorios acreditados para certificación CE (LVD + EMC), FCC y RoHS.
          - strong [ref=f4e397]: Las plataformas GaN V precertificadas de WOWOHCOOL reducen este plazo a la mitad
          - text: y eliminan el coste de certificación para modelos ODM estándar. Si desarrollas un diseño completamente nuevo, el coste de certificación oscila entre $5.000 y $10.000.
