        - paragraph [ref=f4e63]: Puntos Clave
        - paragraph [ref=f4e64]: "GaN V es la quinta generación de semiconductores de nitruro de galio: cargadores 40% más compactos, 20-30°C más fríos y con eficiencia del 95-97% a plena carga. WOWOHCOOL fabrica cargadores GaN V desde 20W hasta 240W PD 3.1 con MOQ de 500 unidades, certificaciones CE/FCC/RoHS incluidas, plazo de 25-30 días y precio FOB desde $9,90/ud para el modelo 65W 3-puertos."
        - list [ref=f4e65]:
          - listitem [ref=f4e66]:
            - strong [ref=f4e67]: "40% más compacto:"
            - text: GaN V opera a >500 kHz — transformadores y disipadores drásticamente menores que el silicio, ahorro logístico de $0,50-2,00/ud en flete
