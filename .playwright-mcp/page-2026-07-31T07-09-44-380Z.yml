      - generic [ref=f4e91]:
        - heading "1. Qué es la Tecnología GaN V" [level=2] [ref=f4e92]
        - paragraph [ref=f4e93]:
          - text: GaN V es la quinta generación de semiconductores de nitruro de galio (GaN) de banda ancha. Frente al silicio, opera a frecuencias de conmutación mucho más altas —
          - strong [ref=f4e94]: superiores a 500 kHz
          - text: "— con pérdidas de conmutación drásticamente menores. El resultado: cargadores un"
          - strong [ref=f4e95]: 40% más pequeños
          - text: ", que funcionan"
          - strong [ref=f4e96]: 20-30°C más fríos
          - text: y entregan más potencia en menos espacio.
        - heading "Diferencias Clave entre GaN V (5ª Gen) y GaN I-III Temprano" [level=3] [ref=f4e97]
        - paragraph [ref=f4e98]: "No todo lo etiquetado como \"GaN\" es igual. Las primeras generaciones (I-III) operan a 100-300 kHz con eficiencias del 88-92%. GaN V duplica la frecuencia y alcanza el 95-97% de eficiencia. La diferencia práctica para el importador: un GaN de primera generación sigue necesitando un transformador y un disipador casi tan grandes como los del silicio; el GaN V los reduce a la mitad."
