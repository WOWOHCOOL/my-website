      - generic [ref=f4e406]:
        - heading "6. Certificaciones Obligatorias para Importar Cargadores GaN a España y la UE" [level=2] [ref=f4e407]
        - heading "CE (LVD + EMC) — Obligatorio para los 27 Estados Miembro" [level=3] [ref=f4e408]
        - paragraph [ref=f4e409]:
          - text: "El marcado CE cubre dos directivas:"
          - strong [ref=f4e410]: LVD
          - text: (seguridad eléctrica según EN 62368-1 para equipos IT/AV) y
          - strong [ref=f4e411]: EMC
          - text: (compatibilidad electromagnética según EN 55032). Sin el marcado CE, la aduana española
          - strong [ref=f4e412]: rechazará el contenedor
          - text: y podrá ordenar su destrucción. Asegúrate de que los certificados estén vinculados a tu modelo exacto, no a uno "similar".
        - heading "RoHS + REACH — Restricción de Sustancias Peligrosas" [level=3] [ref=f4e413]
        - paragraph [ref=f4e414]: RoHS 2011/65/EU limita plomo, mercurio, cadmio y otras 7 sustancias en componentes electrónicos. REACH regula los químicos en los plásticos de la carcasa. Ambas son obligatorias y deben estar documentadas para cada lote de producción.
        - heading "Reglamento de Ecodiseño UE 2025/2052 — En Vigor, Riesgo Real de Rechazo" [level=3] [ref=f4e415]
        - paragraph [ref=f4e416]:
          - text: Este reglamento exige una
          - strong [ref=f4e417]: eficiencia energética mínima incluso al 10% de carga
          - text: . Muchos diseños de silicio no pueden cumplirlo sin rediseños costosos. El GaN V, con su eficiencia del 95-97% en todo el rango de carga, cumple de forma nativa.
          - strong [ref=f4e418]: En 2026 se han reportado contenedores completos rechazados en aduanas europeas
          - text: por documentación de ecodiseño desactualizada — no subestimes este requisito.
        - heading "La DoC (Declaración de Conformidad) Debe Estar a Nombre del Importador" [level=3] [ref=f4e419]
        - paragraph [ref=f4e420]:
          - text: "Un error común entre importadores españoles primerizos: aceptar la DoC a nombre de la fábrica china."
          - strong [ref=f4e421]: Legalmente, la DoC debe emitirse a nombre del importador
          - text: (tu empresa), no del fabricante. Si las autoridades solicitan la documentación y el nombre no coincide con el importador registrado, el producto se considera no conforme. Asegúrate de que tu fabricante te transfiera los informes de laboratorio originales para que puedas emitir tu propia DoC.
        - heading "¿Cuánto Cuesta y Cuánto Tarda Certificar un Cargador GaN V?" [level=3] [ref=f4e422]
        - paragraph [ref=f4e423]:
          - text: "Para un modelo completamente nuevo:"
          - strong [ref=f4e424]: $5.000-$10.000
          - text: "y"
          - strong [ref=f4e425]: 4-8 semanas
          - text: "en organismos notificados UE. Para modelos ODM estándar sobre plataformas precertificadas como las de WOWOHCOOL:"
          - strong [ref=f4e426]: $0
          - text: — las certificaciones CE, FCC y RoHS ya están incluidas en el precio del producto. Los certificados deben ser emitidos por laboratorios acreditados ILAC ISO 17025 (TÜV Rheinland, SGS, Bureau Veritas).
