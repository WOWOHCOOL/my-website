        - heading "Preguntas Frecuentes" [level=2] [ref=f4e463]
        - generic [ref=f4e464]:
          - generic [ref=f4e465]:
            - heading "¿GaN V es lo mismo que GaN?" [level=3] [ref=f4e466]
            - paragraph [ref=f4e467]: No. GaN V es la quinta generación de semiconductores de nitruro de galio. Las primeras generaciones operan a menor frecuencia de conmutación y tienen peor disipación térmica. Algunos fabricantes etiquetan GaN antiguo como 'GaN V' — verifica siempre la frecuencia de conmutación (>500 kHz para GaN V genuino) y la eficiencia (>95% a plena carga).
          - generic [ref=f4e468]:
            - heading "¿Puede un cargador GaN V cargar portátiles?" [level=3] [ref=f4e469]
            - paragraph [ref=f4e470]: Sí. PD 3.1 EPR alcanza hasta 240W (48V/5A), suficiente para cualquier portátil del mercado incluido MacBook Pro 16. Con un solo cargador GaN V de 140W alimentas portátil, tablet y móvil simultáneamente gracias a la asignación dinámica de potencia PPS.
          - generic [ref=f4e471]:
            - heading "¿Cuál es la MOQ para encargar cargadores GaN V OEM?" [level=3] [ref=f4e472]
            - paragraph [ref=f4e473]: "500 unidades para modelos ODM estándar con personalización de marca (logo, embalaje, manuales). OEM personalizado con moldes de carcasa nuevos: 1.000-2.000 unidades. Plazo de producción: 25-30 días OEM estándar, 45-60 días ODM con desarrollo completo. Muestras de ingeniería en 3-7 días para modelos estándar."
          - generic [ref=f4e474]:
            - heading "¿Es seguro el GaN V comparado con el silicio?" [level=3] [ref=f4e475]
            - paragraph [ref=f4e476]: Más seguro. El GaN V opera a 65-75°C a plena carga frente a 85-95°C del silicio equivalente — una diferencia de 20-30°C que reduce drásticamente el riesgo de fallo térmico. Menos temperatura significa menos degradación de componentes, sin cortes térmicos y vida útil más larga. Todos los cargadores GaN V de WOWOHCOOL incluyen 10 capas de protección con apagado térmico redundante y encapsulado térmico profesional.
          - generic [ref=f4e477]:
            - heading "¿Cuánto cuesta certificar un cargador GaN V para vender en la UE?" [level=3] [ref=f4e478]
            - paragraph [ref=f4e479]: "Entre $5.000 y $10.000 por modelo nuevo, con un plazo de 4 a 8 semanas en organismos notificados UE. Las plataformas GaN V precertificadas de WOWOHCOOL reducen este coste a cero para modelos ODM estándar: CE (LVD+EMC), FCC y RoHS ya están incluidas en el precio del producto. La Declaración de Conformidad (DoC) debe emitirse a nombre del importador, no de la fábrica."
          - generic [ref=f4e480]:
            - heading "¿Cómo verifico que el FET de mi cargador es GaN V genuino y no silicio reetiquetado?" [level=3] [ref=f4e481]
            - paragraph [ref=f4e482]: "Tres verificaciones clave: (1) frecuencia de conmutación >500 kHz — pide la hoja de datos del FET y verifica la referencia en el sitio web del fabricante del chip (Infineon, Navitas, Innoscience); (2) eficiencia >95% a plena carga — exige curva de eficiencia certificada por laboratorio externo; (3) termografía a 100% load durante 30+ minutos — GaN V genuino se mantiene a 65-75°C, el silicio supera los 85°C. WOWOHCOOL proporciona esta documentación con cada pedido."
