      - generic [ref=f4e429]:
        - heading "7. Riesgos en la Cadena de Suministro GaN V" [level=2] [ref=f4e430]
        - heading "FET GaN Falsificados — El Riesgo Más Común y Más Caro" [level=3] [ref=f4e431]
        - paragraph [ref=f4e432]:
          - text: Fábricas sin escrúpulos compran MOSFET de silicio sin marca y los reetiquetan como "GaN". El cargador funciona — pero con eficiencia del 85%, temperaturas de 90°C y sin las ventajas del GaN real.
          - strong [ref=f4e433]: Exige siempre trazabilidad del distribuidor autorizado
          - text: del chip (Infineon, Navitas, Innoscience). WOWOHCOOL verifica cada lote de FET entrante en inspección IQC con comprobación de referencia cruzada.
        - heading "Omisión del Encapsulado Térmico en Cargadores >65W" [level=3] [ref=f4e434]
        - paragraph [ref=f4e435]:
          - text: Un cargador GaN de 140W disipa aproximadamente
          - strong [ref=f4e436]: 8,4W de calor
          - text: a plena carga. Sin encapsulado térmico (thermal potting) — un compuesto que rellena el interior de la carcasa y transfiere el calor al exterior — ese calor se acumula, degrada los condensadores y puede fundir la carcasa en uso prolongado. Exige potting de grado profesional con compuestos de conductividad térmica >1,5 W/m·K en cualquier cargador de más de 65W.
        - heading "Condensadores de Baja Calidad y Distancias de PCB Insuficientes" [level=3] [ref=f4e437]
        - paragraph [ref=f4e438]:
          - text: Los condensadores electrolíticos genéricos se secan a las altas frecuencias de conmutación del GaN, provocando
          - strong [ref=f4e439]: rizado de tensión (ripple) destructivo
          - text: que daña los dispositivos conectados. Especifica condensadores de marca japonesa de
          - strong [ref=f4e440]: 105°C
          - text: (Rubycon, Nichicon, Panasonic). Además, para cumplir la norma de seguridad IEC 62368-1, la distancia de fuga (creepage) entre el lado primario y secundario del PCB debe ser de al menos
          - strong [ref=f4e441]: 6,4 mm
          - text: . Algunas fábricas reducen esta distancia para hacer el cargador más pequeño — una violación de seguridad que puede provocar descargas eléctricas.
        - heading "Controladores de Potencia No Dinámicos" [level=3] [ref=f4e442]
        - paragraph [ref=f4e443]:
          - text: "Los microcontroladores baratos no renegocian correctamente los perfiles PDO (Power Data Objects) al conectar múltiples dispositivos. El resultado: un portátil que negocia 20V/5A puede recibir 20V/1,5A cuando se conecta un segundo dispositivo —"
          - strong [ref=f4e444]: carga lentísima o desconexión aleatoria
          - text: . Exige controladores PD 3.1 con firmware actualizable y certificación USB-IF TID.
