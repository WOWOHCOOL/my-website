            - generic [ref=e331]:
              - heading "Electronic Load" [level=4] [ref=e332]
              - paragraph [ref=e333]: "Simulates device loading to test charger output under various conditions. Recommended: Keysight DL3021, or similar 150W+ DC electronic load with CC/CV/CR modes."
