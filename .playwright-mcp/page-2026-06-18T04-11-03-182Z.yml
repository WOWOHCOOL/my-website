            - generic [ref=e337]:
              - heading "Oscilloscope" [level=4] [ref=e338]
              - paragraph [ref=e339]: "Analyzes output ripple, noise, and transient response. Recommended: Keysight DSOS104A or Tektronix MDO3104 with 100MHz+ bandwidth."
