                - listitem [ref=e321]: "—CE/FCC/RoHS Marks: Present and accurate"
                - listitem [ref=e322]: "—User Manual: Included and in correct language"
                - listitem [ref=e323]: "—Cable & Accessories: Present per specification"
                - listitem [ref=e324]: "—Box Condition: No damage, proper sealing"
