        - generic [ref=e274]:
          - heading "7. Comprehensive QC Inspection Checklist" [level=2] [ref=e275]
          - paragraph [ref=e276]: "A thorough inspection covers multiple aspects of the charger. Here's what your QC process should include:"
          - generic [ref=e277]:
            - generic [ref=e278]:
              - heading "Visual & Appearance Inspection" [level=3] [ref=e279]:
                - img [ref=e280]
                - text: Visual & Appearance Inspection
              - list [ref=e282]:
                - listitem [ref=e283]: "—Housing: No cracks, dents, scratches, or discolorations"
                - listitem [ref=e284]: "—Logo & Labeling: Correct placement, spelling, and branding"
                - listitem [ref=e285]: "—Color Match: Consistent with approval samples (Delta E < 2.0)"
                - listitem [ref=e286]: "—Texture: Consistent finish (matte/gloss) as specified"
                - listitem [ref=e287]: "—USB Port: No debris, bent pins, or misalignment"
                - listitem [ref=e288]: "—Plug Pins: Proper plating, no corrosion, correct dimensions"
                - listitem [ref=e289]: "—LED Indicators: Correct color, brightness, and position"
                - listitem [ref=e290]: "—Assembly Gaps: Uniform gaps (< 0.5mm) between parts"
            - generic [ref=e291]:
              - heading "Functional & Electrical Testing" [level=3] [ref=e292]:
                - img [ref=e293]
                - text: Functional & Electrical Testing
              - list [ref=e295]:
                - listitem [ref=e296]: "—Input Voltage: Verify rated input (100-240V for universal chargers)"
                - listitem [ref=e297]: "—Output Voltage: Within ±5% of specified output"
                - listitem [ref=e298]: "—Output Current: Meets rated current under load"
                - listitem [ref=e299]: "—Standby Power: < 0.3W for energy efficiency compliance"
                - listitem [ref=e300]: "—Power Efficiency: ≥90% for standard chargers, ≥95% for Level VI"
                - listitem [ref=e301]: "—No-load Power Consumption: < 0.5W"
                - listitem [ref=e302]: "—Output Ripple & Noise: < 200mV peak-to-peak"
                - listitem [ref=e303]: "—Charging Compatibility: Tests with target devices"
            - generic [ref=e304]:
              - heading "Protection Feature Testing" [level=3] [ref=e305]:
                - img [ref=e306]
                - text: Protection Feature Testing
              - list [ref=e308]:
                - listitem [ref=e309]: "—Over-Voltage Protection (OVP): Triggers at 120-130% of rated output"
                - listitem [ref=e310]: "—Over-Current Protection (OCP): Limits current at 110-150% of max"
                - listitem [ref=e311]: "—Short Circuit Protection: Withstands shorted output for 1 hour"
                - listitem [ref=e312]: "—Over-Temperature Protection: Shuts down at 80-100°C"
                - listitem [ref=e313]: "—ESD Immunity: Survives 8kV contact, 15kV air discharge"
            - generic [ref=e314]:
              - heading "Packaging & Labeling Check" [level=3] [ref=e315]:
                - img [ref=e316]
