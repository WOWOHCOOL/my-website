            - heading "Wireless Charger Coil Alignment" [level=4] [ref=e135]:
              - img [ref=e136]
              - text: Wireless Charger Coil Alignment
            - paragraph [ref=e138]: Precision coil alignment is verified by laser sensors to ensure maximum charging efficiency and 0% magnetic interference with the device.
          - generic [ref=e139]:
            - heading "AOI (Automated Optical Inspection)" [level=4] [ref=e140]:
