          - paragraph [ref=e63]: AC Plug
          - paragraph [ref=e64]: Foldable prongs collapse flat into the housing for backpack and carry-on safety. US, EU, UK, AU plug variants available for OEM.
        - generic [ref=e65]:
          - paragraph [ref=e66]: 92-96%
          - paragraph [ref=e67]: GaN Efficiency
          - paragraph [ref=e68]: Gallium Nitride chips run cooler and 30-40% smaller than silicon. Higher conversion efficiency means more power in a pocketable shell.
        - generic [ref=e69]:
          - paragraph [ref=e70]: 1 = 2
          - paragraph [ref=e71]: Replaces Two Devices
          - paragraph [ref=e72]: No separate wall charger, no spare cable. One SKU on the shelf delivers both functions, reducing packaging and cart-add friction.
