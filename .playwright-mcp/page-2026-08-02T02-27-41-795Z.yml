      - paragraph [ref=f4e401]:
        - strong [ref=f4e402]: "Atención:"
        - text: "UN38.3 solo cubre la seguridad en el transporte. No es suficiente para acceder al mercado UE. Necesita el paquete completo: CE + RoHS + REACH + UN38.3 como mínimo. Muchos importadores primerizos cometen este error y ven su mercancía bloqueada en aduanas."
      - 'heading "Registro EPR en España: RAEE + Baterías + Envases" [level=3] [ref=f4e403]'
      - paragraph [ref=f4e404]: "Como importador que introduce power banks en el mercado español, está obligado a registrarse en tres sistemas de Responsabilidad Ampliada del Productor (EPR):"
      - list [ref=f4e405]:
        - listitem [ref=f4e406]:
          - strong [ref=f4e407]: "RAEE (Real Decreto 110/2015):"
          - text: Residuos de Aparatos Eléctricos y Electrónicos. Debe afiliarse a un
          - strong [ref=f4e408]: SCRAP autorizado
          - text: (como Recyclia, Ecotic o Ambilamp) que gestiona su registro en el
          - strong [ref=f4e409]: Registro Integrado Industrial (RII)
          - text: . Si su empresa no está establecida en España, debe designar un
          - strong [ref=f4e410]: Representante Autorizado
          - text: español.
        - listitem [ref=f4e411]:
          - strong [ref=f4e412]: "Baterías (Real Decreto 106/2008):"
          - text: Al contener baterías de litio, necesita un registro independiente en el
          - strong [ref=f4e413]: Registro de Productores de Baterías
          - text: a través de un SCRAP específico.
        - listitem [ref=f4e414]:
          - strong [ref=f4e415]: "Envases (Real Decreto 1055/2022):"
          - text: Todo packaging que ponga en el mercado español está sujeto a EPR. Declaraciones trimestrales obligatorias.
      - paragraph [ref=f4e416]:
        - strong [ref=f4e417]: "Atención Amazon sellers:"
        - text: Amazon exige números RAEE y de Baterías válidos para vender power banks en Amazon.es. Sin ellos, sus listings serán
        - strong [ref=f4e418]: congelados o eliminados
        - text: . La nueva política de Amazon para dispositivos de alimentación portátil (diciembre 2025) exige además verificación por un
        - strong [ref=f4e419]: proveedor TIC acreditado externo
        - text: ", ya no puede enviar documentación de pruebas directamente."
      - 'heading "Reglamento UE de Baterías 2023/1542: lo que viene" [level=3] [ref=f4e420]'
      - paragraph [ref=f4e421]:
        - text: Vigente desde el
        - strong [ref=f4e422]: 18 de agosto de 2025
        - text: ", el"
        - link "Reglamento UE 2023/1542" [ref=f4e423] [cursor=pointer]:
          - /url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
        - text: "introduce requisitos que se despliegan progresivamente hasta 2027:"
      - list [ref=f4e424]:
        - listitem [ref=f4e425]:
          - strong [ref=f4e426]: "Pasaporte digital de batería (2027):"
          - text: Cada power bank necesitará un registro digital con código QR que contenga origen de fabricación, composición de materiales, huella de carbono y datos de ciclo de vida.
        - listitem [ref=f4e427]:
          - strong [ref=f4e428]: "Declaración de huella de carbono (2025-2026):"
          - text: Obligatoria para baterías industriales y de vehículos eléctricos. Para baterías portátiles (power banks), se espera su extensión progresiva.
        - listitem [ref=f4e429]:
          - strong [ref=f4e430]: "Contenido reciclado mínimo:"
          - text: Objetivos vinculantes de contenido reciclado en baterías a partir de 2031.
      - paragraph [ref=f4e431]: Seleccione un fabricante que ya esté preparándose para estos requisitos. WOWOHCOOL ofrece datos de trazabilidad de materiales y documentación de cadena de suministro con cada pedido OEM.
      - 'heading "CCC: la certificación china que también afecta a su importación" [level=3] [ref=f4e432]'
      - paragraph [ref=f4e433]:
        - text: Desde
        - strong [ref=f4e434]: agosto de 2024
        - text: ", todas las power banks fabricadas en China requieren la certificación obligatoria"
        - strong [ref=f4e435]: CCC (China Compulsory Certification)
        - text: ". Los productos sin marca CCC visible no pueden fabricarse, venderse ni exportarse. Para el importador español, esto significa:"
      - list [ref=f4e436]:
        - listitem [ref=f4e437]:
          - text: Verifique que su fabricante tenga el
          - strong [ref=f4e438]: certificado CCC vigente
          - text: para el modelo que va a personalizar.
        - listitem [ref=f4e439]:
          - text: A partir del
          - strong [ref=f4e440]: 1 de marzo de 2026
          - text: ", cada power bank debe llevar un"
          - strong [ref=f4e441]: código QR trazable
          - text: junto al logotipo CCC.
        - listitem [ref=f4e442]: Las aerolíneas chinas prohíben el transporte de power banks sin marca CCC en vuelos domésticos.
      - paragraph [ref=f4e443]: Un fabricante serio le mostrará el certificado CCC sin que tenga que pedirlo. Si el proveedor no puede mostrar el CCC del modelo que le ofrece, descártelo.
    - generic [ref=f4e446]:
      - 'heading "7. Paso 6: Control de calidad del fabricante, el proceso de 4 etapas" [level=2] [ref=f4e447]'
      - paragraph [ref=f4e448]:
        - text: Solicite siempre muestras de la power bank ya personalizada antes de la producción en serie. El pedido de muestras es el paso más importante de todo el proceso. Pero más allá de la muestra, verifique que el fabricante tenga un sistema QC documentado. En WOWOHCOOL, cada unidad pasa por
        - strong [ref=f4e449]: 4 etapas de control de calidad
        - text: ":"
      - img "Prueba de carga rápida QC en laboratorio WOWOHCOOL, verificación de potencia de salida, protocolos PD/QC/PPS y rendimiento de carga para power banks OEM de marca propia" [ref=f4e450]
      - table [ref=f4e452]:
        - rowgroup [ref=f4e453]:
          - row [ref=f4e454]:
            - columnheader "Etapa" [ref=f4e455]
            - columnheader "Nombre" [ref=f4e456]
            - columnheader "Qué se verifica" [ref=f4e457]
        - rowgroup [ref=f4e458]:
          - row [ref=f4e459]:
            - cell "1" [ref=f4e460]
            - cell "IQC (Incoming QC)" [ref=f4e461]
            - cell "Celdas de batería (Grado A, no recicladas), chips IC, PCB, conectores, carcasas. Se verifica trazabilidad de lote y certificados de cada componente." [ref=f4e462]
          - row [ref=f4e463]:
            - cell "2" [ref=f4e464]
            - cell "IPQC (In-Process QC)" [ref=f4e465]
            - cell "Soldadura SMT, colocación de componentes, cableado, montaje de PCB. Monitorización continua durante toda la línea de producción." [ref=f4e466]
          - row [ref=f4e467]:
            - cell "3" [ref=f4e468]
            - cell "FQC (Final QC)" [ref=f4e469]
            - cell "Rendimiento de carga real (potencia de salida, protocolos PD/QC/PPS), funcionamiento de puertos, botones, indicadores LED, pantalla TFT. 100% de unidades, no por muestreo." [ref=f4e470]
          - row [ref=f4e471]:
            - cell "4" [ref=f4e472]
            - cell "OQC (Outgoing QC)" [ref=f4e473]
            - 'cell "Pre-embarque: integridad del embalaje, accesorios completos (cable, manual), etiquetado correcto, código de barras legible, marcado CE visible." [ref=f4e474]'
      - 'heading "Prueba de envejecimiento: 4 horas por unidad, 100% cobertura" [level=3] [ref=f4e475]'
      - paragraph [ref=f4e476]:
        - text: La prueba de envejecimiento consiste en someter
        - strong [ref=f4e477]: cada unidad
        - text: a un ciclo completo de carga-descarga bajo carga durante
        - strong [ref=f4e478]: 4 horas mínimo
        - text: antes del embalaje. Esto detecta fallos tempranos que solo aparecen con el uso continuado. El estándar de la industria es hacer solo 2 horas o por muestreo. WOWOHCOOL aplica 4 horas al
        - strong [ref=f4e479]: 100% de las unidades
        - text: producidas.
      - heading "Métricas de calidad WOWOHCOOL vs. industria" [level=3] [ref=f4e480]
      - table [ref=f4e482]:
        - rowgroup [ref=f4e483]:
          - row [ref=f4e484]:
            - columnheader "Métrica" [ref=f4e485]
            - columnheader "WOWOHCOOL" [ref=f4e486]
            - columnheader "Media del sector" [ref=f4e487]
        - rowgroup [ref=f4e488]:
          - row [ref=f4e489]:
            - cell "Tasa de rendimiento (yield)" [ref=f4e490]
            - cell ">98%" [ref=f4e491]
            - cell "95-97%" [ref=f4e492]
          - row [ref=f4e493]:
            - cell "Tasa de defectos" [ref=f4e494]
            - cell "<0,3%" [ref=f4e495]
            - cell "2-5%" [ref=f4e496]
          - row [ref=f4e497]:
            - cell "Entregas a tiempo" [ref=f4e498]
            - cell ">97%" [ref=f4e499]
            - cell "85-92%" [ref=f4e500]
          - row [ref=f4e501]:
            - cell "Retención de clientes" [ref=f4e502]
            - cell ">85%" [ref=f4e503]
            - cell "60-70%" [ref=f4e504]
      - heading "Qué verificar en las muestras antes de aprobar producción" [level=3] [ref=f4e505]
      - list [ref=f4e506]:
        - listitem [ref=f4e507]:
          - strong [ref=f4e508]: "Posición y calidad del logotipo:"
          - text: ¿La impresión/grabado es nítido y está bien alineado? ¿Resiste el roce?
        - listitem [ref=f4e509]:
          - strong [ref=f4e510]: "Embalaje:"
          - text: ¿La power bank encaja correctamente? ¿Todos los impresos y colores son correctos?
        - listitem [ref=f4e511]:
          - strong [ref=f4e512]: "Rendimiento de carga:"
          - text: Verifique la potencia real de salida con un comprobador USB-C. Una desviación superior al 10% sobre la especificación es un defecto de calidad.
        - listitem [ref=f4e513]:
          - strong [ref=f4e514]: "Protocolos de carga:"
          - text: ¿Negocia correctamente PD, PPS, QC con diferentes dispositivos?
        - listitem [ref=f4e515]:
          - strong [ref=f4e516]: "Capacidad real:"
          - text: Un power bank de 10.000 mAh debe entregar aproximadamente 6.000-6.500 mAh utilizables (la diferencia se debe a la conversión de voltaje de 3,7V a 5V, es normal y física, no un engaño).
      - 'heading "Inspección externa pre-embarque: cuándo contratarla" [level=3] [ref=f4e517]'
      - paragraph [ref=f4e518]:
        - text: Para primeras series o pedidos de alto valor, se recomienda contratar una
        - strong [ref=f4e519]: inspección de terceros
        - text: (SGS, Bureau Veritas, TÜV) que verifique una muestra estadística (AQL 2.5 o 1.0) de la mercancía antes del envío. El coste es de aproximadamente
        - strong [ref=f4e520]: 300-500 EUR
        - text: y confirma independientemente que el lote cumple sus especificaciones. Es una inversión sensata para el primer pedido.
    - generic [ref=f4e523]:
      - 'heading "8. Paso 7: Logística y lanzamiento al mercado español" [level=2] [ref=f4e524]'
      - 'heading "Transporte de mercancías peligrosas (DG Clase 9): opciones y costes" [level=3] [ref=f4e525]'
