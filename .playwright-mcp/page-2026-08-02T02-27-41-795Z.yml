    - generic [ref=f4e663]:
      - heading "Preguntas Frecuentes" [level=2] [ref=f4e664]
      - generic [ref=f4e665]:
        - generic [ref=f4e666]:
          - heading "¿Cuánto cuesta crear una power bank con marca propia?" [level=3] [ref=f4e667]
          - paragraph [ref=f4e668]: "El coste FOB de fabricación oscila entre 5,80 y 16,00 USD por unidad para 500 unidades, según capacidad y potencia. Añada 3.000-7.000 USD en certificaciones (CE, RoHS, UN38.3), personalización de logotipo (0,50-1,50 USD/ud) y embalaje (0,80-2,00 USD/ud). Coste total estimado para 500 uds de 10.000 mAh: 8.000-18.000 EUR todo incluido. WOWOHCOOL ofrece presupuesto completo desglosado en 24h."
        - generic [ref=f4e669]:
          - heading "¿Qué certificaciones necesito para vender power banks en España?" [level=3] [ref=f4e670]
          - paragraph [ref=f4e671]: "Las certificaciones obligatorias son: marcado CE (LVD + EMC), RoHS, REACH, UN38.3 para transporte y MSDS. Como importador debe registrarse en el RII-P (RAEE) según Real Decreto 110/2015 y en el Registro de Productores de Baterías (RD 106/2008). Desde agosto 2025 aplica el Reglamento UE 2023/1542 de Baterías que exige pasaporte digital y declaración de huella de carbono. WOWOHCOOL incluye soporte de certificación con pedidos OEM."
        - generic [ref=f4e672]:
          - heading "¿Cuánto tarda la producción OEM de una power bank con marca propia?" [level=3] [ref=f4e673]
          - paragraph [ref=f4e674]: "Muestras: 3-7 días tras confirmación de diseño. Producción OEM en masa: 25-30 días tras aprobación de muestra. Transporte marítimo a España: 25-35 días. Proceso completo puerta a puerta: 10-12 semanas. Para pedidos urgentes, el transporte aéreo reduce el tránsito a 3-7 días con un coste adicional de aproximadamente 7 USD/kg."
        - generic [ref=f4e675]:
          - heading "¿Qué MOQ necesito para crear una power bank con mi logotipo?" [level=3] [ref=f4e676]
          - paragraph [ref=f4e677]: El MOQ estándar para OEM completo (logotipo + color + embalaje personalizado) es de 500 unidades en WOWOHCOOL. Para serigrafía simple de 1 color, desde 100-300 unidades. Para grabado láser, 100-300 unidades. La mayoría de competidores exigen 1.000+ unidades para el mismo nivel de personalización. WOWOHCOOL ofrece MOQ 500 como estándar de entrada para proyectos de marca propia.
        - generic [ref=f4e678]:
          - heading "¿Qué diferencia hay entre OEM y ODM para una marca de power banks?" [level=3] [ref=f4e679]
          - paragraph [ref=f4e680]: "OEM (Original Equipment Manufacturer): personaliza un modelo existente del catálogo del fabricante con su marca, colores y embalaje. MOQ desde 500 uds, plazo 25-30 días. Ideal para primeras marcas. ODM (Original Design Manufacturer): desarrolla un producto completamente nuevo desde cero con diseño exclusivo, moldes propios e I+D. MOQ 1.000-3.000 uds, plazo 45-60 días. Requiere mayor inversión pero ofrece diferenciación total."
        - generic [ref=f4e681]:
          - heading "¿Cómo evito problemas de calidad en power banks de marca propia importadas de China?" [level=3] [ref=f4e682]
          - paragraph [ref=f4e683]: Exija un proceso QC documentado de 4 etapas (IQC → IPQC → FQC → OQC) con prueba de envejecimiento del 100% de unidades durante mínimo 4 horas. Verifique la trazabilidad del origen de las celdas de batería (Grado A, no recicladas). Solicite informe UN38.3 y MSDS completos antes del envío. Contrate una inspección externa pre-embarque (300-500 EUR). WOWOHCOOL mantiene tasa de defectos inferior al 0,3% frente al 2-5% del sector.
        - generic [ref=f4e684]:
          - heading "¿Puedo vender mi power bank de marca propia en Amazon España?" [level=3] [ref=f4e685]
          - paragraph [ref=f4e686]: "Sí, pero necesita: registro EPR en España (RAEE + Baterías + Envases), certificaciones CE/RoHS/UN38.3, y desde diciembre 2025, verificación por proveedor TIC acreditado según la política de Amazon para dispositivos de alimentación portátil. La fecha límite de cumplimiento fue el 15 de marzo de 2026. También debe designar un Representante Autorizado español si su empresa no está establecida en España."
