      - paragraph [ref=f4e58]:
        - text: En España se venden más de
        - strong [ref=f4e59]: 10 millones de power banks al año
        - text: ", un mercado de 500 millones de euros. Crear su propia marca no requiere fábrica ni equipo de I+D: un fabricante OEM con planta propia en Shenzhen se encarga del desarrollo y la producción, mientras usted controla la distribución, el marketing y la construcción de su marca."
      - paragraph [ref=f4e60]: "Esta guía cubre el proceso completo en 7 pasos: selección del modelo base (5.000-27.000 mAh), personalización de logotipo y embalaje, costes reales FOB con MOQ desde 500 unidades, certificaciones CE/UN38.3/EPR para España, control de calidad de 4 etapas y logística DDP puerta a puerta. Timeline total: 10-12 semanas desde el primer contacto hasta la entrega en su almacén."
    - img "Power Bank con marca propia, producción OEM para importadores en España, fábrica ISO 9001 WOWOHCOOL Shenzhen" [ref=f4e62]
    - generic [ref=f4e64]:
      - paragraph [ref=f4e65]: Puntos Clave
      - paragraph [ref=f4e66]: "Crear una power bank con marca propia desde China requiere: seleccionar un fabricante OEM con fábrica propia ISO 9001, elegir un modelo base (5.000-27.000 mAh, desde $4.80/ud FOB), personalizar logotipo y embalaje, y gestionar las certificaciones CE/RoHS/UN38.3 obligatorias para España. Con MOQ desde 500 unidades, el coste total landed DDP a Madrid ronda los 8.000-18.000 EUR para un primer pedido de 10.000 mAh."
      - list [ref=f4e67]:
        - listitem [ref=f4e68]:
          - strong [ref=f4e69]: "Modelo base:"
          - text: 10.000 mAh PD 20W es la categoría más vendida en Amazon España. FOB desde $5.80-8.00/ud (500 uds). El margen bruto con marca propia es del 40-60% frente al 15-25% de productos sin marca.
        - listitem [ref=f4e70]:
          - strong [ref=f4e71]: "Personalización:"
          - text: Grabado láser (acabado premium), serigrafía (mejor relación calidad-precio), impresión UV (color). Embalaje personalizado con diseño de marca desde 300-500 uds.
        - listitem [ref=f4e72]:
          - strong [ref=f4e73]: "Certificaciones obligatorias:"
          - text: "CE (LVD+EMC), RoHS, REACH, UN38.3, MSDS + Registro EPR (RAEE + Baterías + Envases) en España. Coste total: 3.000-8.000 EUR."
        - listitem [ref=f4e74]:
          - strong [ref=f4e75]: "Control de calidad:"
          - text: "4 etapas (IQC→IPQC→FQC→OQC) + aging test de 4 horas al 100% de unidades. Tasa de defectos WOWOHCOOL: <0,3% vs 2-5% del sector."
        - listitem [ref=f4e76]:
          - strong [ref=f4e77]: "Timeline:"
          - text: 10-12 semanas puerta a puerta. Producción OEM 25-30 días + transporte marítimo 25-35 días. DDP recomendado para el primer pedido.
