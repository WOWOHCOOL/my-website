      - 'heading "Factory-Direct vs. Trading Company: la diferencia real" [level=3] [ref=f4e353]'
      - paragraph [ref=f4e354]:
        - img "Celdas de batería Grado A en laboratorio WOWOHCOOL, trazabilidad de componentes y verificación de autenticidad para power banks OEM de marca propia" [ref=f4e355]
      - paragraph [ref=f4e356]:
        - text: Comprar directamente al fabricante (WOWOHCOOL = Dong Yi Technology Co., Ltd, fábrica ISO 9001 de 5.000㎡ en Shenzhen) supone un
        - strong [ref=f4e357]: ahorro del 20-40%
        - text: "frente a un intermediario (trading company) en Alibaba. La diferencia no solo está en el precio unitario: un fabricante real ofrece soporte de certificación incluido, control de calidad de 4 etapas con prueba de envejecimiento del 100% de unidades, y trazabilidad completa desde la celda de batería hasta el envío. Un intermediario solo coordina, no controla la calidad."
    - generic [ref=f4e360]:
      - 'heading "6. Paso 5: Certificaciones y cumplimiento normativo España 2026" [level=2] [ref=f4e361]'
      - paragraph [ref=f4e362]:
        - text: Este es el capítulo más crítico para cualquier importador. Las power banks contienen baterías de litio y están sujetas a
        - strong [ref=f4e363]: tres capas regulatorias
        - text: "en España: certificaciones de producto (CE/RoHS/REACH/UN38.3), registro como productor (EPR/RAEE), y el nuevo Reglamento UE de Baterías 2023/1542. Un producto no conforme puede ser"
        - strong [ref=f4e364]: retenido y destruido en aduanas sin compensación
        - text: . Como importador, usted es el responsable legal último.
      - 'heading "Certificaciones de producto: costes y plazos reales" [level=3] [ref=f4e365]'
