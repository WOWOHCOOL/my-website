      - 'heading "Incoterms: ¿FOB o DDP?" [level=3] [ref=f4e537]'
      - paragraph [ref=f4e538]: "La elección del Incoterm determina quién asume riesgos y costes en cada tramo:"
      - list [ref=f4e539]:
        - listitem [ref=f4e540]:
          - strong [ref=f4e541]: "FOB Shenzhen:"
          - text: WOWOHCOOL gestiona producción + transporte al puerto + despacho de exportación. Usted contrata el transporte internacional, seguro y despacho de importación en España. Más económico si ya tiene experiencia en importación.
        - listitem [ref=f4e542]:
          - strong [ref=f4e543]: "DDP (Delivered Duty Paid):"
          - text: WOWOHCOOL gestiona todo, producción, transporte internacional, seguro, aranceles, IVA y entrega en su almacén en España. Recomendado para el primer pedido o si prefiere evitar la complejidad aduanera.
      - paragraph [ref=f4e544]:
        - text: Para el primer pedido de marca propia,
        - strong [ref=f4e545]: DDP es la opción más segura
        - text: . Usted recibe la mercancía en su puerta sin preocuparse de aduanas, documentación DG ni coordinación de transitarios.
      - heading "Canales de venta para su marca de power bank" [level=3] [ref=f4e546]
      - list [ref=f4e547]:
        - listitem [ref=f4e548]:
          - strong [ref=f4e549]: "Amazon FBA:"
          - text: El canal más importante para empezar. Con una buena ficha de producto, imágenes de calidad y palabras clave optimizadas, puede obtener las primeras ventas y valoraciones.
        - listitem [ref=f4e550]:
          - strong [ref=f4e551]: "Tienda online propia (Shopify/WooCommerce):"
          - text: Para construir una marca a largo plazo con control total sobre la imagen de marca y los datos de clientes.
        - listitem [ref=f4e552]:
          - strong [ref=f4e553]: "Venta B2B corporativa:"
          - text: Power banks con logotipo para ferias, eventos y fidelización de clientes. Presupuestos por volumen con margen recurrente.
        - listitem [ref=f4e554]:
          - strong [ref=f4e555]: "Tiendas especializadas y grandes almacenes:"
          - text: Diríjase a cadenas de electrónica con una presentación comercial profesional y producto diferenciado.
