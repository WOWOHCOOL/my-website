          - paragraph [ref=e341]:
            - strong [ref=e342]: "How to use this table during sourcing:"
            - text: When you receive a sample, ask the supplier to confirm the FET part number and provide the manufacturer datasheet. Cross-reference the part on the vendor's website. If the supplier refuses to disclose the part or quotes a generic "domestic GaN FET" without a brand-name part number, treat it as a sourcing risk.
            - link "Navitas" [ref=e343] [cursor=pointer]:
              - /url: https://navitassemi.com/
            - text: and
            - link "Innoscience" [ref=e344] [cursor=pointer]:
              - /url: https://www.innoscience.com/
            - text: publish full datasheets with switching frequency, gate-charge, and thermal resistance — these are the numbers that prove the generation claim.
          - paragraph [ref=e345]:
            - strong [ref=e346]: Anker, Belkin, and Ugreen
            - text: have all publicly disclosed their use of Navitas GaNFast in flagship product lines (per
            - link "Semiconductor Today coverage" [ref=e347] [cursor=pointer]:
              - /url: https://www.semiconductor-today.com/news_items/2022/jul/anker-190722.shtml
            - text: ). For OEM buyers building competing products, specifying the same FET family is the fastest path to matching their performance benchmarks while still controlling your branding and packaging.
        - generic [ref=e348]:
          - heading "8. How to Identify Real GaN V" [level=2] [ref=e349]
          - paragraph [ref=e350]: "The GaN labeling problem is real. Here are five verification methods for OEM buyers:"
          - paragraph [ref=e351]:
            - strong [ref=e352]: 1. Check switching frequency.
            - text: Genuine GaN V operates at 5MHz or higher. This number must appear in the technical datasheet. If a supplier cannot provide it, proceed with caution.
          - paragraph [ref=e353]:
            - strong [ref=e354]: 2. Verify the GaN FET manufacturer.
            - text: Real GaN V uses FETs from Navitas, Innoscience, GaN Systems, or EPC. Request the specific part number and cross-reference it against the manufacturer's published specifications.
          - paragraph [ref=e355]:
            - strong [ref=e356]: 3. Request thermal images.
            - text: A genuine GaN V charger should maintain 65-75C at full load after 30 minutes. If the supplier's charger runs at 85C+, it is using older generation GaN or enhanced silicon.
          - paragraph [ref=e357]:
            - strong [ref=e358]: 4. Confirm PD 3.1 EPR support.
            - text: Only GaN V supports the full 240W Extended Power Range. If a "GaN V" charger maxes out at 100W PD 3.0, the labeling is incorrect.
          - paragraph [ref=e359]:
            - strong [ref=e360]: 5. Size check.
            - text: A genuine 100W GaN V charger occupies approximately 70cm or less. If the product is significantly larger than a deck of cards, it is not using GaN V.
          - paragraph [ref=e361]:
            - strong [ref=e362]: "Real-world example:"
            - text: A European distributor tested samples from three different "GaN V" suppliers. Only one passed all five checks. The other two were using GaN III and enhanced silicon respectively, labeled as GaN V. The distributor saved an estimated $40,000 in potential returns and brand damage by verifying before committing to a 10,000-unit order.
          - paragraph [ref=e363]:
            - text: Working with an established OEM partner eliminates verification risk. WOWOHCOOL sources GaN V FETs directly from Navitas and Innoscience, maintains full component traceability, and provides thermal test data with every sample shipment. Our
