        - generic [ref=e365]:
          - heading "9. Which Generation Should You Choose?" [level=2] [ref=e366]
          - paragraph [ref=e367]: "Your choice depends on three factors: target retail price point, product lifecycle expectations, and brand positioning."
          - paragraph [ref=e368]:
            - strong [ref=e369]: Choose GaN I only if
            - text: you are building an absolute budget product (sub-$20 retail) and your customers do not expect premium performance. Be aware that many retailers and distributors now require a minimum of GaN III for new listings.
          - paragraph [ref=e370]:
            - strong [ref=e371]: Choose GaN III if
            - text: you are launching a mid-range product line, testing a new market with conservative volume, or need to hit a specific retail price point below $45. GaN III delivers solid performance at a 10-15% BOM premium and is well-understood by contract manufacturers.
          - paragraph [ref=e372]:
            - strong [ref=e373]: Choose GaN V if
            - text: you are building a premium brand, targeting retail price points above $45, or need PD 3.1 power above 140W. The 20-35% BOM premium is offset by higher average selling prices, lower return rates, and the marketing advantage of "5th Generation GaN" technology.
        - generic [ref=e374]:
          - 'heading "10. What''s Next: GaN VI and GaN+SiC Hybrid Designs" [level=2] [ref=e375]'
          - paragraph [ref=e376]: "If you are planning a charger product cycle that ships in 2027-2028, the next-generation roadmap matters. Three technology shifts are already visible in semiconductor vendor announcements:"
          - paragraph [ref=e377]:
            - strong [ref=e378]: GaN VI (engineering samples 2027).
            - text: "Navitas, Innoscience, and Infineon have all signaled a sixth-generation GaN family targeting 7-8MHz switching frequencies and integrated digital control. The expected gains: another 30-40% size reduction over GaN V at 100W, plus on-die telemetry that lets the charger negotiate not just voltage but also thermal headroom in real-time. Commercial volume is expected late 2028 to 2029."
          - paragraph [ref=e379]:
            - strong [ref=e380]: GaN + SiC hybrid topologies.
            - text: For chargers above 240W (workstation hubs, EV-class portable chargers), pairing GaN V on the primary side with silicon carbide (SiC) on the high-voltage rectification side delivers efficiency gains of 1-2 percentage points at full load. This is overkill for phone chargers but relevant for the emerging 300-500W laptop docking station category.
          - paragraph [ref=e381]:
            - strong [ref=e382]: Integrated drive + protection ICs.
            - text: Navitas' GaNSafe and Power Integrations' InnoSwitch4 platforms bundle the FET, gate driver, current sensing, and over-temperature protection into a single package. For OEMs, this cuts BOM count by 8-12 components per charger and shrinks PCB area by ~25%, but locks the design to a single supplier ecosystem.
          - paragraph [ref=e383]:
            - strong [ref=e384]: "What this means for your 2026 sourcing decisions:"
            - text: GaN V remains the best choice for products shipping through 2027. Avoid locking in GaN III for designs you plan to keep in market past 2026, since retail channels are increasingly listing "GaN generation" in product specs and GaN III will look dated by 2027.
