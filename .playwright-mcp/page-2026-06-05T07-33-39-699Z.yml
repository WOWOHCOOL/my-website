          - paragraph [ref=e394]:
            - strong [ref=e395]: Which GaN generation should OEM buyers choose in 2026?
            - text: GaN V is the recommended choice for most new charger OEM projects. It delivers 5MHz+ switching frequency, 97% peak efficiency, 65-75C operating temperature, and PD 3.1 support up to 240W. The 20-35% BOM premium over GaN I is typically recovered within 6-12 months through higher selling prices, lower shipping costs, and reduced return rates.
        - generic [ref=e396]:
          - heading "11. Frequently Asked Questions" [level=2] [ref=e397]
          - generic [ref=e398]:
            - generic [ref=e399]:
              - paragraph [ref=e400]: How do I know what GaN generation a charger uses?
              - paragraph [ref=e401]: Check the datasheet for switching frequency (GaN V = 5MHz+), GaN FET part number, and supported PD version. Reputable OEM suppliers provide this information on request.
            - generic [ref=e402]:
              - paragraph [ref=e403]: Is GaN V worth the premium over GaN III?
              - paragraph [ref=e404]: For premium brand positioning, yes. The 20-35% BOM premium is offset by higher selling prices, lower shipping weight, better thermal performance, and the marketing advantage. Most brands recover the premium within 6-12 months.
            - generic [ref=e405]:
              - paragraph [ref=e406]: Can GaN III support PD 3.1?
              - paragraph [ref=e407]: Some advanced GaN III designs support PD 3.1 up to 140W, but 240W EPR requires GaN V's higher switching frequency and thermal headroom.
            - generic [ref=e408]:
              - paragraph [ref=e409]: What is the MOQ for OEM GaN V chargers?
              - paragraph [ref=e410]: 500-1,000 units for standard ODM configurations with branding. Custom OEM designs with tooling start at 2,000 units. WOWOHCOOL offers lower MOQ for pilot runs.
            - generic [ref=e411]:
              - paragraph [ref=e412]: Will GaN prices drop further?
              - paragraph [ref=e413]: Yes. GaN FET prices have been declining 10-15% annually as production scales. Industry analysts project GaN V will reach price parity with GaN III by 2027-2028.
            - generic [ref=e414]:
              - paragraph [ref=e415]: What is the difference between enhancement-mode and cascode GaN?
              - paragraph [ref=e416]: Enhancement-mode (e-mode) GaN switches natively without a silicon MOSFET companion — used in GaN III and V. Cascode GaN pairs a silicon MOSFET with a depletion-mode GaN HEMT — used in GaN I. E-mode reduces switching losses and PCB complexity but requires tighter gate-drive voltage control.
            - generic [ref=e417]:
              - paragraph [ref=e418]: Why do charger specs skip GaN II and GaN IV?
              - paragraph [ref=e419]: GaN II and GaN IV exist primarily in research and high-voltage industrial applications (defense, satellite power, LiDAR). They use different substrate architectures that are cost-prohibitive for consumer chargers and have not entered commercial charger production.
            - generic [ref=e420]:
              - paragraph [ref=e421]: What GaN FET part numbers should I look for in OEM quotes?
              - paragraph [ref=e422]: "For GaN V: Navitas NV6128/NV6169, Innoscience INN700D240A, Infineon CoolGaN G5, or EPC EPC2218. For GaN III: Navitas NV6115 or GaN Systems GS66508T. Always cross-reference the part number against the manufacturer's published datasheet to confirm the generation."
            - generic [ref=e423]:
              - paragraph [ref=e424]: Does GaN V support all PD 3.1 EPR voltage steps?
              - paragraph [ref=e425]: Yes. GaN V's 5MHz+ switching enables stable transitions across 28V, 36V, and 48V EPR levels, plus PPS with 20mV granularity. GaN III typically caps at 20V PD 3.0 SPR, with some designs reaching 140W but not full EPR.
            - generic [ref=e426]:
              - paragraph [ref=e427]: When will GaN VI hit the market?
              - paragraph [ref=e428]: Industry roadmaps from Navitas and Innoscience suggest GaN VI engineering samples in 2027-2028, targeting 7-8MHz switching and integrated digital control. Commercial volume for OEM charger production is expected around 2029.
