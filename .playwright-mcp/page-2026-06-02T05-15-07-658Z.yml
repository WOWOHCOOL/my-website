          - heading "UL 62368-1 —Safety (Effectively Mandatory)" [level=3] [ref=e77]
          - paragraph [ref=e78]:
            - text: Technically voluntary under federal law, UL certification is required by Amazon, Walmart, and Best Buy to list chargers. Amazon now enforces UL test reports for chargers and power adapters.
