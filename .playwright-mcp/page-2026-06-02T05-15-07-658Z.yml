        - generic [ref=e197]:
          - 'heading "EU Battery Regulation 2023/1542: What Changes in 2027" [level=2] [ref=e198]'
          - paragraph [ref=e199]:
            - text: The
            - strong [ref=e200]: EU Battery Regulation (2023/1542)
            - text: replaces the old Battery Directive and introduces sweeping new requirements for any product containing batteries — including power banks, portable chargers, and laptop chargers with integrated cells. Full enforcement begins
            - strong [ref=e201]: February 18, 2027
            - text: .
          - paragraph [ref=e202]: "For B2B importers sourcing charging products from China, this regulation adds four major compliance layers on top of existing CE requirements:"
          - heading "1. Battery Passport (Digital Identity)" [level=3] [ref=e203]
          - paragraph [ref=e204]: Every industrial and EV battery (and portable batteries above 2 kWh from 2027) must carry a unique digital passport accessible via QR code. The passport records chemistry, capacity, manufacturing origin, carbon footprint data, and recycled content. Your factory must implement traceability systems to generate this data.
          - heading "2. Carbon Footprint Declaration" [level=3] [ref=e205]
          - paragraph [ref=e206]: Manufacturers must calculate and declare the carbon footprint of each battery model across its full lifecycle — from raw material extraction through production. By 2028, batteries exceeding carbon intensity thresholds will be banned from the EU market. Factories without carbon accounting capabilities will become ineligible suppliers.
          - heading "3. Extended Producer Responsibility (EPR)" [level=3] [ref=e207]
          - paragraph [ref=e208]: Importers must register with national EPR schemes in every EU country where they sell, finance end-of-life collection and recycling, and meet minimum recycled content targets (16% cobalt, 6% lithium, 6% nickel by 2031). This applies to all portable batteries including those in power banks.
          - heading "4. Supply Chain Due Diligence" [level=3] [ref=e209]
          - paragraph [ref=e210]: Economic operators must implement due diligence policies covering cobalt, lithium, nickel, and natural graphite sourcing. This means auditable supply chain documentation from mine to finished product — a requirement many smaller factories cannot yet meet.
          - 'heading "Compliance Timeline: Key Deadlines" [level=3] [ref=e211]'
