          - 'heading "1b. NEW: FCC Bans Chinese Testing Labs (May 2026)" [level=2] [ref=e116]'
          - paragraph [ref=e117]:
            - text: In May 2026, the FCC voted to
            - link "prohibit China-based testing laboratories" [ref=e118] [cursor=pointer]:
              - /url: https://www.govinfo.gov/content/pkg/FR-2026-05-15/html/2026-09821.htm
            - text: from performing equipment authorization for electronics destined for the US market. This affects approximately 75% of global device certifications.
          - heading "What This Means for Importers" [level=3] [ref=e119]
          - generic [ref=e120]:
            - generic [ref=e121]:
              - heading "Existing Certifications" [level=4] [ref=e122]
              - paragraph [ref=e123]: All existing FCC certifications remain valid. Products already certified through Chinese labs are grandfathered — no retesting needed.
            - generic [ref=e124]:
              - heading "New Certifications" [level=4] [ref=e125]
              - paragraph [ref=e126]: All new FCC certifications must use US-based, EU-based, or other approved NRTLs (TUV, Intertek, UL, etc.). Chinese labs can no longer issue FCC test reports.
          - heading "Impact on Certification Cost & Timeline" [level=3] [ref=e127]
          - paragraph [ref=e128]: Expect 15-30% cost increases and 1-3 week timeline extensions as demand shifts to non-Chinese labs. Importers should factor this into 2026 product launch schedules.
          - generic [ref=e129]:
            - heading "WOWOHCOOL Position" [level=4] [ref=e130]
            - paragraph [ref=e131]:
              - text: WOWOHCOOL works exclusively with globally recognized labs — TUV, Intertek, and UL — for all FCC certifications. Our clients are not disrupted by this change.
              - link "Contact us" [ref=e132] [cursor=pointer]:
                - /url: /contact
              - text: for certification timeline planning.
