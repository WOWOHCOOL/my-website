        - paragraph [ref=f21e226]: La mayoría de power banks de consumo (5.000-20.000 mAh = 18,5-74 Wh) están por debajo del umbral de 2 kWh, por lo que los requisitos de huella de carbono, etiqueta A-E y Battery Passport no aplican directamente. Sin embargo, es importante conocerlos porque el umbral puede bajar en futuras revisiones.
        - heading "Certificaciones Obligatorias para Power Banks en España" [level=3] [ref=f21e227]
        - list [ref=f21e228]:
          - listitem [ref=f21e229]:
            - strong [ref=f21e230]: "CE (EN 62133):"
            - text: Seguridad de baterías recargables. Obligatorio para entrada en la UE. El fabricante emite la Declaración de Conformidad (DoC).
          - listitem [ref=f21e231]:
            - strong [ref=f21e232]: "RoHS:"
            - text: Restricción de sustancias peligrosas (plomo ≤0,01%, cadmio, mercurio). Obligatorio.
          - listitem [ref=f21e233]:
            - strong [ref=f21e234]: "REACH:"
            - text: Registro de sustancias químicas. Aplica a plásticos de carcasa, soldaduras y componentes.
          - listitem [ref=f21e235]:
            - strong [ref=f21e236]: "UN38.3 (2026):"
            - text: Obligatorio para transporte aéreo y marítimo. Debe incluir el nuevo test de apilamiento de 3 metros.
          - listitem [ref=f21e237]:
            - strong [ref=f21e238]: "RAEE:"
            - text: Registro como productor de residuos electrónicos en España. Obligatorio para el importador. Tasa anual ~200 € + 1-2% del PVP.
          - listitem [ref=f21e239]:
            - strong [ref=f21e240]: "GB 47372-2026 (China):"
            - text: Nueva norma china de seguridad para baterías, en vigor desde junio 2026. Se espera que elimine del mercado al 70% de productos no conformes — una ventaja para los fabricantes que ya la cumplen.
