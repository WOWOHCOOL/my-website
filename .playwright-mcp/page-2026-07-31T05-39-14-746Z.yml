        - paragraph [ref=f21e303]:
          - text: "La producción se realiza en instalaciones con certificación ISO 9001 con un protocolo QC de 4 etapas:"
          - strong [ref=f21e304]: IQC
          - text: (control de entrada de celdas, chips, conectores) →
          - strong [ref=f21e305]: IPQC
          - text: (control en línea de montaje SMT, soldadura) →
          - strong [ref=f21e306]: FQC
          - text: "(prueba funcional del 100%: rendimiento de carga/descarga, temperatura en carga máxima) →"
          - strong [ref=f21e307]: OQC
          - text: "(inspección pre-embarque: embalaje, accesorios, etiquetado)."
        - paragraph [ref=f21e308]:
          - text: El
          - strong [ref=f21e309]: 100% de las unidades
          - text: pasa un aging test de 4 horas bajo carga completa — el estándar de la industria es 2 horas o solo por muestreo. La tasa de defectos de WOWOHCOOL es
          - strong [ref=f21e310]: menos del 0,3%
          - text: frente al 2-5% del promedio sectorial. Para más detalles sobre el sistema de calidad, consulte nuestra
          - link "guía de control de calidad en fábricas chinas" [ref=f21e311] [cursor=pointer]:
