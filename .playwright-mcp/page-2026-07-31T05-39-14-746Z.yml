        - paragraph [ref=f21e167]: "La última fila es la que decide el negocio: el coste de producción solo sube un 10-20%, pero el precio de venta se multiplica por 2-3. La diferencia está en la diferenciación — el cliente paga más por un producto visiblemente más delgado y objetivamente más seguro."
      - generic [ref=f21e168]:
        - 'heading "3. Seguridad: La Ventaja que Cierra Ventas" [level=2] [ref=f21e169]'
        - paragraph [ref=f21e170]: "La seguridad no es una característica técnica abstracta; es el argumento de venta más potente para una power bank en 2026. Tres razones:"
        - 'heading "Prueba de Perforación: El Test que Ningún Li-Po Supera" [level=3] [ref=f21e171]'
        - paragraph [ref=f21e172]:
          - text: "En las pruebas de certificación, una celda semi-sólida es atravesada con un clavo de acero de 3 mm. El resultado:"
          - strong [ref=f21e173]: sin incendio, sin explosión, sin humo
          - text: . La misma prueba en una celda Li-Po provoca un incendio en segundos. Marcas como CE-LINK y BMX publican estos vídeos en sus fichas de producto de Amazon — y los clientes lo entienden instantáneamente. Para el importador, esto se traduce en un argumento de venta que ningún competidor con Li-Po puede igualar.
        - img "Pruebas térmicas QC en fábrica de power banks semi-sólidas — control de temperatura bajo carga 100% para certificación UN38.3 y exportación OEM a España | WOWOHCOOL" [ref=f21e174]
        - 'heading "Transporte Aéreo: Menos Trabas con UN38.3" [level=3] [ref=f21e175]'
        - paragraph [ref=f21e176]:
          - text: Desde el
          - strong [ref=f21e177]: 1 de enero de 2026
          - text: ", la normativa IATA DGR endureció el transporte aéreo de baterías de litio. El límite de"
          - strong [ref=f21e178]: SOC ≤30% se aplica ahora también a UN3481
          - text: (baterías embaladas CON equipos, como power banks con su cable), no solo a UN3480 (baterías sueltas). Se añadió un
          - strong [ref=f21e179]: nuevo test de apilamiento de 3 metros
          - text: que invalida los informes UN38.3 antiguos. Las celdas semi-sólidas, al tener un riesgo de fuga térmica drásticamente menor, pasan estos trámites con más agilidad y menos costes de verificación adicional.
        - generic [ref=f21e180]:
          - paragraph [ref=f21e181]: "⚠️ Atención importador: UN38.3 2026"
          - paragraph [ref=f21e182]: Si su proveedor le entrega un informe UN38.3 anterior a enero 2026, no es válido para el nuevo test de apilamiento. Exija un informe actualizado. Además, las power banks enviadas por avión deben tener ≤30% de carga — conserve el certificado de verificación de SOC para aduanas.
      - generic [ref=f21e183]:
        - 'heading "4. Cumplimiento Normativo OEM: Certificaciones para Importadores en España" [level=2] [ref=f21e184]'
        - paragraph [ref=f21e185]: Esta es la sección que más dinero puede ahorrarle. El Reglamento de Baterías UE 2023/1542 es la normativa más importante que afecta a las power banks en 2026 y muchos importadores aún no la conocen.
        - 'heading "Reglamento de Baterías UE 2023/1542: Calendario de Exigencia" [level=3] [ref=f21e186]'
        - table [ref=f21e188]:
