      - generic [ref=e320]:
        - generic [ref=e321]:
          - heading "What is the MOQ for 3-in-1 wireless charging stations?" [level=3] [ref=e322]
          - paragraph [ref=e323]:
            - text: "Standard ODM models with custom logo: MOQ"
            - strong [ref=e324]: 500 units
            - text: ". Full OEM with private tooling:"
            - strong [ref=e325]: 2,000 units
            - text: ". Sample turnaround: 3-7 days."
        - generic [ref=e326]:
          - heading "Do your 3-in-1 chargers support Samsung and Apple devices simultaneously?" [level=3] [ref=e327]
          - paragraph [ref=e328]: Yes. Our 3-in-1 charging docks support simultaneous fast charging for iPhone (15W/25W Qi2 MPP) or Samsung Galaxy (15W Qi), Apple Watch (2.5-5W), and AirPods/TWS (5W). Qi2 universal standard means both ecosystems charge at full speed.
        - generic [ref=e329]:
          - heading "What is the difference between the 15W and 25W models?" [level=3] [ref=e330]
          - paragraph [ref=e331]:
            - text: 15W models (WOW82, WOW90, WOW93, WOW98) use Qi2 MPP standard for iPhone 12-16 and Android Qi2 devices.
            - strong [ref=e332]: 25W models (WOW10, WOW18, WOW19, WOW122)
            - text: use Qi v2.2.1 extended power profile for Pixel 10, Galaxy S25, and iPhone 16 with 25W wireless charging. All 25W models include active cooling (fan or TEC) to maintain sustained max output.
        - generic [ref=e333]:
          - heading "What certifications do your 3-in-1 stations have?" [level=3] [ref=e334]
          - paragraph [ref=e335]: All models are WPC Qi2 certified, CE (EMC + Low Voltage Directive) for EU, FCC Part 15 for US, and RoHS compliant. Qi2 certification means they pass the WPC's ATL (Authorized Test Lab) testing for magnetic alignment accuracy and power delivery consistency.
        - generic [ref=e336]:
          - heading "Can I get custom colors and materials for 3-in-1 stations?" [level=3] [ref=e337]
          - paragraph [ref=e338]: "Yes. Full CMF (Color/Material/Finish) customization for OEM/ODM orders: aluminum alloy, zinc alloy, ABS+PC in custom colors, glass surfaces, and silicone finishes. Custom packaging and logo printing included. MOQ 2,000 for full CMF customization."
        - generic [ref=e339]:
          - heading "Are your 3-in-1 stations suitable for hotel and hospitality use?" [level=3] [ref=e340]
          - paragraph [ref=e341]: Yes. WOW90 (zinc alloy + night light) and WOW18 (night-light cube) are specifically designed for hotel bedside use. They feature durable metal construction, ambient lighting, universal Qi2 compatibility, and bulk hospitality pricing from 1,000+ units with custom engraving.
