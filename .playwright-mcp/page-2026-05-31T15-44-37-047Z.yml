                - img [ref=e349]
                - text: Carbon Footprint Reduction
              - paragraph [ref=e351]: A single GaN charger operating at 95% efficiency vs 85% efficiency saves approximately 15-20W of wasted energy per charger. For a business deploying 10,000 chargers, this translates to substantial aggregate energy savings and reduced carbon emissions over the product lifecycle.
