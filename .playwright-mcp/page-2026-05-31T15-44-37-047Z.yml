          - heading "6. How GaN Semiconductors Work" [level=2] [ref=e223]
          - generic [ref=e224]:
            - paragraph [ref=e225]: Understanding GaN technology doesn't require a degree in electrical engineering. Here's a simplified breakdown of how gallium nitride semiconductors revolutionize charging.
            - generic [ref=e226]:
              - generic [ref=e227]:
                - generic [ref=e228]: "1"
                - generic [ref=e229]:
                  - heading "The Bandgap Advantage" [level=3] [ref=e230]
                  - paragraph [ref=e231]: GaN has a bandgap of 3.4 eV compared to silicon's 1.1 eV. This fundamental property allows GaN devices to handle higher voltages and frequencies without breaking down. Think of it as the difference between a rubber band and a steel spring — one stretches and snaps, the other holds firm under pressure.
              - generic [ref=e232]:
                - generic [ref=e233]: "2"
                - generic [ref=e234]:
                  - heading "Faster Switching, Less Heat" [level=3] [ref=e235]
                  - paragraph [ref=e236]: "GaN transistors switch on and off up to 100x faster than silicon MOSFETs. This high-speed switching means energy spends less time in transition, resulting in minimal heat generation. The result: a charger that stays cool while delivering more power."
              - generic [ref=e237]:
                - generic [ref=e238]: "3"
                - generic [ref=e239]:
                  - heading "Higher Electron Mobility" [level=3] [ref=e240]
                  - paragraph [ref=e241]: Electrons move through GaN material approximately 30% faster than in silicon. This translates to lower resistance and less energy lost as heat. In technical terms, GaN achieves this while maintaining a smaller die size — hence the compact charger designs we see today.
              - generic [ref=e242]:
                - generic [ref=e243]: "4"
                - generic [ref=e244]:
                  - heading "Zero Reverse Recovery Loss" [level=3] [ref=e245]
                  - paragraph [ref=e246]: Unlike silicon diodes that experience "reverse recovery" losses when switching direction, GaN devices have negligible recovery losses. This is particularly beneficial in switched-mode power supplies where efficiency gains directly impact the charger's thermal performance.
          - paragraph [ref=e247]:
            - text: According to
            - link "Transphorm" [ref=e248] [cursor=pointer]:
              - /url: https://www.transphorm.com/
            - text: ", one of the leading GaN power semiconductor manufacturers, GaN enables power conversion efficiency exceeding 99% in certain applications."
