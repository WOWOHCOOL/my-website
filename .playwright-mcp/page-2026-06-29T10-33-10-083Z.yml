      - heading "3-in-1 Station FAQ" [level=2] [ref=e469]
      - generic [ref=e470]:
        - generic [ref=e471]:
          - heading "What is the MOQ for 3-in-1 wireless charging stations?" [level=3] [ref=e472]
          - paragraph [ref=e473]:
            - text: "Standard ODM models with custom logo: MOQ"
            - strong [ref=e474]: 500 units
            - text: ". Full OEM with private tooling:"
            - strong [ref=e475]: 2,000 units
            - text: ". Sample turnaround: 3-7 days."
        - generic [ref=e476]:
          - heading "Do your 3-in-1 chargers support Samsung and Apple devices simultaneously?" [level=3] [ref=e477]
          - paragraph [ref=e478]: Yes. Our 3-in-1 charging docks support simultaneous fast charging for iPhone (15W/25W Qi2 MPP) or Samsung Galaxy (15W Qi), Apple Watch (2.5-5W), and AirPods/TWS (5W). Qi2 universal standard means both ecosystems charge at full speed.
        - generic [ref=e479]:
          - heading "What is the difference between the 15W and 25W models?" [level=3] [ref=e480]
          - paragraph [ref=e481]:
            - text: 15W models (WOW82, WOW90, WOW93, WOW98) use Qi2 MPP standard for iPhone 12-16 and Android Qi2 devices.
            - strong [ref=e482]: 25W models (WOW122, WOW133, WOW125, WOW115, WOW10, WOW18, WOW19)
            - text: use Qi v2.2.1 extended power profile for Pixel 10, Galaxy S25, and iPhone 16 with 25W wireless charging. All 25W models include active cooling (fan or TEC) to maintain sustained max output.
        - generic [ref=e483]:
          - heading "What certifications do your 3-in-1 stations have?" [level=3] [ref=e484]
          - paragraph [ref=e485]: All models are WPC Qi2 certified, CE (EMC + Low Voltage Directive) for EU, FCC Part 15 for US, and RoHS compliant. Qi2 certification means they pass the WPC's ATL (Authorized Test Lab) testing for magnetic alignment accuracy and power delivery consistency.
        - generic [ref=e486]:
          - heading "Can I get custom colors and materials for 3-in-1 stations?" [level=3] [ref=e487]
          - paragraph [ref=e488]: "Yes. Full CMF (Color/Material/Finish) customization for OEM/ODM orders: aluminum alloy, zinc alloy, ABS+PC in custom colors, glass surfaces, and silicone finishes. Custom packaging and logo printing included. MOQ 2,000 for full CMF customization."
        - generic [ref=e489]:
          - heading "Are your 3-in-1 stations suitable for hotel and hospitality use?" [level=3] [ref=e490]
          - paragraph [ref=e491]: Yes. WOW90 (zinc alloy + night light) and WOW18 (night-light cube) are specifically designed for hotel bedside use. They feature durable metal construction, ambient lighting, universal Qi2 compatibility, and bulk hospitality pricing from 1,000+ units with custom engraving.
