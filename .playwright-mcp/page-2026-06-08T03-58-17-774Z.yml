          - strong [ref=e57]: $3.94 billion by 2031
          - text: (CAGR 26.53%), with China accounting for approximately 65% of production. Meanwhile, the
          - strong [ref=e58]: EU Ecodesign Regulation 2025/2052
          - text: now mandates standby power below 0.1W, a threshold many silicon designs cannot meet, making GaN V the only practical choice for new products destined for European markets.
        - paragraph [ref=e59]: This guide covers what GaN V actually means, how to evaluate real GaN manufacturers, and key questions before placing your OEM order.
