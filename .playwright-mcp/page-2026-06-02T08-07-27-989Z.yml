          - 'heading "3. European Union: CE & UKCA" [level=2] [ref=e112]'
          - paragraph [ref=e113]: Selling in the EU requires CE marking, which is a self-declaration process. The manufacturer must maintain a Technical File demonstrating compliance and is subject to market surveillance by national authorities.
          - generic [ref=e114]:
            - generic [ref=e115]:
              - heading "CE-LVD (Low Voltage Directive)" [level=3] [ref=e116]
              - paragraph [ref=e117]: Applies to products between 50-1000V AC or 75-1500V DC. Requires compliance with EN 62368-1, plus technical documentation including risk assessment and user safety instructions in local language.
            - generic [ref=e118]:
              - heading "ErP Directive (Energy Related Products)" [level=3] [ref=e119]
              - paragraph [ref=e120]: Standby power must be below 0.3W. External power supplies must meet Level VI efficiency (average efficiency above 88%).
          - generic [ref=e121]:
            - 'heading "UK Post-Brexit: UKCA Marking" [level=3] [ref=e122]'
            - paragraph [ref=e123]: The UK requires UKCA marking instead of CE. CE is accepted during a transition period until 2027, but new product submissions should use UKCA.
          - generic [ref=e124]:
            - heading "Asia-Pacific Market Certifications" [level=3] [ref=e125]
            - paragraph [ref=e126]:
              - strong [ref=e127]: PSE
              - text: (Japan),
              - strong [ref=e128]: KC
              - text: (South Korea), and
              - strong [ref=e129]: CCC
              - text: (China) are mandatory for their respective markets. WOWOHCOOL supports all three through established testing laboratory relationships.
          - generic [ref=e131]:
            - generic [ref=e132]:
              - heading "GaN Charger Safety Focus" [level=3] [ref=e133]
              - paragraph [ref=e134]: GaN technology enables higher power densities in smaller form factors, creating unique thermal management challenges.
