        - generic [ref=e71]:
          - paragraph [ref=e72]: QUICK ANSWER
          - paragraph [ref=e73]:
            - strong [ref=e74]: What safety certifications do I need to sell chargers in the US and EU?
            - text: "For the US: UL 62368-1 (safety) and FCC Part 15 (EMI). For the EU: CE marking including EN 62368-1 (safety) and EMC Directive 2014/30/EU. Additional standards apply: UL 2056 for power banks, IEC 62368-1 as global baseline, and UN38.3 for battery air transport. WOWOHCOOL holds all certifications across our product lines."
        - generic [ref=e75]:
          - 'heading "1. IEC 62368-1: The Global Safety Baseline" [level=2] [ref=e76]'
          - paragraph [ref=e77]: "IEC 62368-1 has become the universal safety standard for audio/video and information technology equipment, replacing the older IEC 60950-1 and IEC 60065. All major markets now converge on this standard: UL 62368-1 (US), EN 62368-1 (EU), and CSA-C22.2 No. 62368-1 (Canada)."
          - paragraph [ref=e78]:
            - strong [ref=e79]: "Important 2026 update:"
            - text: IEC 62368-1
            - strong [ref=e80]: Fourth Edition
            - text: becomes mandatory on
            - strong [ref=e81]: February 15, 2027
            - text: "(US/International). A key change: components previously certified under IEC 60950-1 or IEC 60065 are no longer accepted —all components must now be certified to IEC 62368-1. New charger designs should target Fourth Edition compliance now to avoid rework."
          - generic [ref=e82]:
            - generic [ref=e83]:
              - heading "Fire Prevention" [level=3] [ref=e84]
              - paragraph [ref=e85]: IEC 62368-1 mandates stringent fire enclosure requirements. Materials must self-extinguish within defined timeframes. V-0 rated plastics (UL 94) self-extinguish in under 10 seconds with no flaming drips —exceeding the minimum V-1 requirement for most applications.
            - generic [ref=e86]:
              - heading "Electrical Shock Protection" [level=3] [ref=e87]
              - paragraph [ref=e88]: Requirements for insulation, clearance, and creepage distances ensure accessible surfaces remain safe under fault conditions. Proper design maintains at least 4mm creepage for basic insulation and uses triple-insulated wire for transformer secondaries.
        - generic [ref=e89]:
          - 'heading "2. North America: UL & FCC Requirements" [level=2] [ref=e90]'
          - paragraph [ref=e91]: For the US market, UL 62368-1 is the de facto safety standard. While technically voluntary under federal law, UL certification is required by Amazon, Walmart, and Best Buy to list chargers. Without it, major retail channels are effectively closed.
          - generic [ref=e92]:
            - heading "UL 94 V-0 Fire-Retardant Materials" [level=3] [ref=e93]
            - paragraph [ref=e94]: "Charger housings must use materials that pass flame retardant testing:"
            - list [ref=e95]:
              - listitem [ref=e96]: "—V-0 rating: Self-extinguishes in under 10 seconds, no flaming drips"
              - listitem [ref=e97]: —Critical for GaN chargers where high power density creates elevated thermal stress
              - listitem [ref=e98]: —ETL mark (Intertek) is recognized as equivalent to UL by OSHA and major retailers
            - paragraph [ref=e100]:
              - strong [ref=e101]: "UL 94 7th Edition update (Feb 2026):"
              - text: New requirements apply to thin-wall enclosures (�?.8mm wall thickness) —materials that previously passed V-1 may fail under the updated test methods. UL 94 markings must now include both the flame class (e.g., V-0) and the sample thickness. Chargers with ultra-slim designs common in GaN products should be re-verified against the 7th Edition standards.
          - heading "FCC Part 15B" [level=3] [ref=e102]
          - paragraph [ref=e103]: All chargers with switching power supplies must comply with FCC electromagnetic interference regulations. FCC has no mutual recognition with CE —separate testing is required.
        - generic [ref=e104]:
