        - generic [ref=e168]:
          - heading "5. Common Certification Failures" [level=2] [ref=e169]
          - paragraph [ref=e170]: Understanding why chargers fail safety testing helps avoid costly redesigns. Approximately 40% of first-time submissions from new manufacturers fail at least one critical test.
          - generic [ref=e171]:
            - generic [ref=e172]:
              - heading "1. Fire Enclosure Failures" [level=3] [ref=e173]
              - paragraph [ref=e174]: "The charger casing catches fire during fault condition testing. Common causes: insufficient flame-retardant materials, inadequate ventilation, or recycled plastics."
              - paragraph [ref=e175]:
                - strong [ref=e176]: "Solution:"
                - text: Specify V-0 rated UL94 materials that pass 850°C glow wire testing.
            - generic [ref=e177]:
              - heading "2. Temperature Limit Exceedance" [level=3] [ref=e178]
              - paragraph [ref=e179]: Accessible surfaces exceed 77°C during normal operation, creating burn hazards.
              - paragraph [ref=e180]:
                - strong [ref=e181]: "Solution:"
                - text: Thermal pads, adequate heat sinks, OTP shutdown at 105°C.
            - generic [ref=e182]:
              - heading "3. Dielectric Strength Breakdown" [level=3] [ref=e183]
              - paragraph [ref=e184]: Insulation fails under 1500V AC testing. Current leaks create shock hazards.
              - paragraph [ref=e185]:
                - strong [ref=e186]: "Solution:"
                - text: Maintain minimum 4mm creepage distances, use triple-insulated transformer wire.
            - generic [ref=e187]:
              - heading "4. Single Fault Conditions" [level=3] [ref=e188]
              - paragraph [ref=e189]: When components fail, the charger creates hazards instead of safely shutting down.
              - paragraph [ref=e190]:
                - strong [ref=e191]: "Solution:"
                - text: Redundant protection circuits. Every safety function needs a backup.
            - generic [ref=e192]:
              - heading "5. Mechanical Strength Issues" [level=3] [ref=e193]
              - paragraph [ref=e194]: Cracked housings, loose USB ports, or detached AC prongs under stress testing.
              - paragraph [ref=e195]:
                - strong [ref=e196]: "Solution:"
                - text: Ultrasonically welded seams, thermal glue for internal components.
