    - generic [ref=e319]:
      - heading "Why Choose WOWOH COOL for Heated Apparel Batteries" [level=2] [ref=e320]:
        - text: Why Choose
        - generic [ref=e321]: WOWOH
        - text: COOL for Heated Apparel Batteries
      - paragraph [ref=e322]: Specialized expertise in wearable battery design. From compact gloves to high-capacity jackets, every form factor engineered for safe, reliable heat delivery.
      - generic [ref=e323]:
        - generic [ref=e324]:
          - heading "Wearable Form Factor Expertise" [level=3] [ref=e325]
          - paragraph [ref=e326]: Mini batteries for gloves and socks, slim packs for jackets, ultra-compact for scarves. We engineer the cell layout to fit your apparel pocket dimensions exactly.
        - generic [ref=e327]:
          - heading "Temperature Controller Integration" [level=3] [ref=e328]
          - paragraph [ref=e329]: Compatible with 3-level and 5-level heat controllers. We provide matched battery + controller pairs tested together for stable output across all heat settings.
        - generic [ref=e330]:
          - heading "CE/PSE Certified" [level=3] [ref=e331]
          - paragraph [ref=e332]: Full certification documentation for EU (CE), Japan (PSE), and global air freight (UN38.3). Required for major retail and e-commerce channels worldwide.
        - generic [ref=e333]:
          - heading "Seasonal Demand Flexibility" [level=3] [ref=e334]
          - paragraph [ref=e335]: Heated apparel is seasonal. We support flexible MOQ (500 units) and fast turnaround to help brands ramp up before winter without overcommitting capital.
        - generic [ref=e336]:
          - heading "Wearable-Grade Safety" [level=3] [ref=e337]
          - paragraph [ref=e338]: OTP (over-temperature), OCP (over-current), SCP (short-circuit) protection circuits standard. Critical for batteries worn directly against the body.
        - generic [ref=e339]:
          - heading "Custom Connector Options" [level=3] [ref=e340]
          - paragraph [ref=e341]: DC barrel (3.5mm, 5.5mm), magnetic pogo pins, and proprietary connectors. Send us your existing apparel sample and we'll match the connector exactly.
