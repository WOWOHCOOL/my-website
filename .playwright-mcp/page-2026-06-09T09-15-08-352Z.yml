    - generic [ref=e436]:
      - heading "Safety Certifications for Wearable Batteries" [level=2] [ref=e437]
      - paragraph [ref=e438]: Wearable heating batteries sit against the body for hours — certification isn't optional. The 2026 Fieldsheer heated socks lawsuit underscores why brands must source from certified manufacturers. WOWOHCOOL batteries ship with full documentation for every major market.
      - generic [ref=e439]:
        - generic [ref=e440]:
          - heading "IEC 62133-2" [level=3] [ref=e441]
          - paragraph [ref=e442]: International safety standard for portable batteries. Covers short circuit, overcharge, thermal abuse, and mechanical testing. The global baseline for wearable battery safety.
        - generic [ref=e443]:
          - heading "UN38.3 Transport" [level=3] [ref=e444]
          - paragraph [ref=e445]: Required for air/sea freight of lithium batteries. Complete test report + MSDS included. All models under 100Wh for unrestricted carry-on compliance.
        - generic [ref=e446]:
          - heading "CE / FCC / RoHS" [level=3] [ref=e447]
          - paragraph [ref=e448]: Standard compliance for EU (CE), North America (FCC), and hazardous substance restrictions (RoHS). Included on all standard models at no extra cost.
        - generic [ref=e449]:
          - heading "UL 2054 (Amazon US)" [level=3] [ref=e450]
          - paragraph [ref=e451]: Amazon requires UL certification for batteries sold on US marketplace. We assist with UL 2054 / UL 1642 application, testing coordination, and documentation.
        - generic [ref=e452]:
          - heading "PSE (Japan)" [level=3] [ref=e453]
          - paragraph [ref=e454]: Product Safety Electrical Appliance mark required for Japanese market. We support PSE certification for heated apparel battery packs entering the Japan retail channel.
        - generic [ref=e455]:
          - heading "Over-Temperature Protection" [level=3] [ref=e456]
          - paragraph [ref=e457]: Built-in BMS with over-temperature cutoff at 65°C, over-current protection, short circuit protection, and overcharge/over-discharge protection on every cell.
