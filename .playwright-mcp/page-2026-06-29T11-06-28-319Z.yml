      - generic [ref=e215]:
        - generic [ref=e216]:
          - heading "What is the difference between a wireless charging pad and a stand?" [level=3] [ref=e217]
          - paragraph [ref=e218]: A pad is a flat charger that sits on your desk — the phone lies flat. A stand holds the phone upright in landscape or portrait orientation, ideal for Face ID unlock, video calls, and StandBy mode. WOWOHCOOL manufactures both form factors with identical Qi2 25W charging performance.
