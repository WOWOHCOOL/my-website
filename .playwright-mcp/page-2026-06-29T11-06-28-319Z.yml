        - generic [ref=e224]:
          - heading "What certifications do desktop wireless chargers need?" [level=3] [ref=e225]
          - paragraph [ref=e226]: Qi2 WPC certification for magnetic alignment and 15W/25W MPP. CE (EMC + Low Voltage Directive) for EU. FCC Part 15 for US. RoHS for materials compliance. All certifications provided with OEM orders.
