              - generic [ref=e554]:
                - heading "Comprehensive Quality Testing" [level=4] [ref=e555]
                - paragraph [ref=e556]: "Test samples thoroughly using your own criteria. For chargers and power banks, go beyond visual inspection. Here is a charging-specific testing protocol:"
                - list [ref=e557]:
                  - listitem [ref=e558]:
                    - text: "-"
                    - strong [ref=e559]: "PD protocol negotiation:"
                    - text: Test at every voltage level the product claims (5V, 9V, 12V, 15V, 20V). Use a USB-C power meter to verify the charger actually negotiates and sustains each PD profile.
                  - listitem [ref=e560]:
                    - text: "-"
                    - strong [ref=e561]: "Real Wh output vs. rated mAh:"
                    - text: Discharge the power bank through a USB load tester and measure actual watt-hours delivered. Most power banks deliver 70-90% of rated capacity. Below 70% indicates low-quality cells.
                  - listitem [ref=e562]:
                    - text: "-"
                    - strong [ref=e563]: "Thermal performance under load:"
                    - text: Run the charger or power bank at maximum rated output for 30 minutes. Measure surface temperature with an IR thermometer. Sustained temperatures above 55°C indicate inadequate thermal design.
                  - listitem [ref=e564]:
                    - text: "-"
                    - strong [ref=e565]: "Multi-port simultaneous load:"
                    - text: If the charger has multiple ports, test all ports under load simultaneously. Many chargers advertise high total wattage but throttle individual ports when all are in use.
                  - listitem [ref=e566]:
                    - text: "-"
                    - strong [ref=e567]: "Build quality and safety:"
                    - text: Check for UL/CE markings on the body (not just the packaging), verify the plug is firmly attached, confirm cable strain relief is adequate, and look for any sharp edges or misaligned seams.
                  - listitem [ref=e568]:
                    - text: "-"
                    - strong [ref=e569]: "Multi-batch consistency:"
                    - text: If possible, order samples from two different production batches 2-3 weeks apart. Test both batches to the same protocol. Significant variance between batches indicates process control problems.
                - paragraph [ref=e570]:
                  - text: Compare against your specifications and competitor products. Document all measurements with photos.
