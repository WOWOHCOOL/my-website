        - generic [ref=e345]:
          - 'heading "6. Remote Factory Verification: Video Audit Best Practices" [level=2] [ref=e346]'
          - paragraph [ref=e347]: Not every buyer can visit Shenzhen in person. Video-based remote audits — now standard practice since 2020 — let you verify a factory from anywhere in the world. When done correctly, a video audit reveals 80% of what an on-site visit would. When done poorly, it confirms nothing. Use this protocol to make your remote verification count.
          - paragraph [ref=e349]:
            - strong [ref=e350]: "Cost benchmark:"
            - text: A professional on-site factory audit by Bureau Veritas, SGS, or TUV costs $300-800 per auditor per day. A self-conducted video audit costs nothing but your time. For orders under $10,000, a thorough video audit is usually sufficient. For orders above $10,000 or first-time partnerships, consider combining a video audit with a third-party on-site verification.
          - generic [ref=e351]:
            - generic [ref=e352]:
              - 'heading "Live Video Tour: What to Request" [level=3] [ref=e353]'
              - paragraph [ref=e354]: "Do not accept pre-recorded footage. Request a live, real-time video call (WeChat, Zoom, or WhatsApp). Ask the factory contact to start outside the building — show the entrance sign, street name, and building number — then walk continuously inside to the production floor. The transition should be seamless with no cuts. Request they show:"
              - list [ref=e355]:
                - listitem [ref=e356]: "- The company sign at the building entrance (match it to the business license)"
                - listitem [ref=e357]: "- SMT lines in operation (count the machines while they run)"
                - listitem [ref=e358]: "- QC testing stations with equipment powered on"
                - listitem [ref=e359]: "- Aging test room with products actively under burn-in"
                - listitem [ref=e360]: "- Raw material storage area (empty shelves = no real production)"
                - listitem [ref=e361]: "- Packaging line with finished goods (check for other brands' logos)"
                - listitem [ref=e362]: "- Worker count on the floor (pan slowly — do not let them stage a section)"
            - generic [ref=e363]:
              - heading "Same-Day Proof Techniques" [level=3] [ref=e364]
              - paragraph [ref=e365]: To confirm the video is live and at the claimed location, use these verification techniques. Ask the contact to write your company name and today's date on a whiteboard or piece of paper and hold it up on camera inside the production area. Request they show a current local newspaper. Ask them to pan to a specific machine or workstation you name on the spot — a pre-recorded video cannot accommodate spontaneous requests. If they hesitate or make excuses for any of these requests, treat it as a red flag.
            - generic [ref=e366]:
              - heading "Satellite & Map Cross-Reference" [level=3] [ref=e367]
              - paragraph [ref=e368]:
                - text: Before the video call, pull up the factory address on both
                - link "Google Maps" [ref=e369] [cursor=pointer]:
                  - /url: https://www.google.com/maps
