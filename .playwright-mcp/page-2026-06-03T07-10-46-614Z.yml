          - paragraph [ref=e301]: Counterfeit certifications are rampant in Chinese manufacturing. Fake certifications are a real problem. A factory may show impressive certificates on their website. But many are forged, expired, or simply do not apply to the products you need. Always verify every certification yourself. There is no substitute for independent checks when protecting your business.
