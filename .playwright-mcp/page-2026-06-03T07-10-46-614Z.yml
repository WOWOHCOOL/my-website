        - generic [ref=e245]:
          - heading "4. How to Detect a Trading Company Posing as a Factory" [level=2] [ref=e246]
          - paragraph [ref=e247]: One of the most common and costly mistakes in China sourcing is believing you are dealing with a factory when you are actually talking to a trading company. Trading companies serve a legitimate role, but when they pretend to be manufacturers — inflating prices, hiding the real production source, and adding layers of miscommunication — your business pays the price. An estimated 30% of B2B platform suppliers claiming to be manufacturers are actually intermediaries. Here is how to tell the difference.
          - generic [ref=e248]:
            - generic [ref=e249]:
              - heading "Registered Capital Analysis" [level=3] [ref=e250]
              - generic [ref=e251]:
                - paragraph [ref=e253]:
                  - text: In China, registered capital is a strong signal of entity type. Manufacturers typically register at
                  - strong [ref=e254]: ¥1-10 million
                  - text: to support equipment, raw materials, and workforce investment. Trading companies commonly register at
                  - strong [ref=e255]: ¥100,000-500,000
                  - text: — enough for an office and inventory purchases, but not for production infrastructure.
                - paragraph [ref=e257]:
                  - text: Verify registered capital on
                  - link "gsxt.gov.cn" [ref=e258] [cursor=pointer]:
                    - /url: https://www.gsxt.gov.cn/
                  - text: or through
                  - link "Tianyancha" [ref=e259] [cursor=pointer]:
                    - /url: https://www.tianyancha.com/
                  - text: . If the registered capital is under ¥500,000 and the company claims to operate a factory with SMT lines, molding equipment, and QC labs, something does not add up.
              - paragraph [ref=e260]:
                - strong [ref=e261]: "Red flag:"
                - text: The factory claims 200+ employees and 50M+ monthly capacity, but registered capital is only ¥200,000.
            - generic [ref=e262]:
              - heading "Business Scope Verification" [level=3] [ref=e263]
              - paragraph [ref=e264]:
                - text: Every Chinese business license includes a "business scope" (经营范围) field. A real manufacturer's scope includes terms like
                - strong [ref=e265]: 生产 (production), 制造 (manufacturing), 加工 (processing)
                - text: . A trading company's scope lists
                - strong [ref=e266]: 销售 (sales), 批发 (wholesale), 进出口 (import/export)
                - text: without production terms. A company that only has trading scope but calls itself a factory is misrepresenting itself.
              - paragraph [ref=e267]:
                - strong [ref=e268]: "Pro tip:"
                - text: If the business scope includes 10+ unrelated categories — electronics, clothing, furniture, toys — the entity is almost certainly a trading company, not a specialized manufacturer.
            - generic [ref=e269]:
              - heading "Product Range Breadth Check" [level=3] [ref=e270]
              - paragraph [ref=e271]: Real factories specialize. A genuine charger manufacturer produces chargers, power banks, and related charging accessories — not also clothing, furniture, and kitchenware. If a supplier's catalog spans 5+ unrelated product categories, they are aggregating from multiple factories. This means inconsistent quality, no direct production oversight, and higher prices from middleman margins.
              - paragraph [ref=e272]:
                - strong [ref=e273]: "Verify:"
                - text: Browse their full product catalog. Count distinct product categories. More than 3 unrelated categories is a warning sign.
            - generic [ref=e274]:
              - heading "Physical Facility Indicators" [level=3] [ref=e275]
              - generic [ref=e276]:
                - paragraph [ref=e278]: "During on-site visits or video tours, look for these factory indicators: loading docks with trucks, raw material storage areas, production equipment noise, worker uniforms with the company name, and factory-floor signage matching the business license entity."
                - paragraph [ref=e280]: "Trading company warning signs: a pristine showroom with no production equipment behind it, conference rooms but no workshop floor, equipment nameplates that show a different company, and \"we just moved\" or \"renovating\" excuses that prevent production floor access."
              - paragraph [ref=e281]:
                - strong [ref=e282]: "Critical check:"
                - text: A factory with a beautiful showroom but minimal production equipment visible is likely a trading company. Real factories show wear — production is not pristine.
            - generic [ref=e283]:
              - heading "Utility Bill & Overhead Verification" [level=3] [ref=e284]
              - paragraph [ref=e285]:
                - text: Real manufacturing consumes significant electricity. A factory with SMT lines should have monthly electric bills in the
                - strong [ref=e286]: ¥10,000-50,000+
                - text: range. A trading company's office electricity bill typically runs under
                - strong [ref=e287]: ¥3,000/month
                - text: . Request to see recent utility bills during verification. Industrial electricity rates and consumption patterns are hard to fake.
              - paragraph [ref=e288]:
                - strong [ref=e289]: "Ask for:"
                - text: Last 3 months of electricity bills. Cross-reference the meter address with the factory address on the business license.
            - generic [ref=e290]:
              - heading "Employee Count vs. Claimed Capacity" [level=3] [ref=e291]
              - paragraph [ref=e292]: "If a factory claims 1M+ units monthly but you count fewer than 50 workers during a tour, the math does not work. A rough rule: each production worker contributes roughly 2,000-5,000 units monthly depending on product complexity. Use this to sanity-check claims. Also verify social insurance registration records — the number of employees registered for social insurance is publicly accessible through Tianyancha and should roughly match their claimed workforce."
            - generic [ref=e293]:
              - 'heading "Dropshipping vs. Manufacturing: The Sample Test" [level=3] [ref=e294]'
              - paragraph [ref=e295]: Request a sample with a small, specific customization — a different cable color, a logo engraving, a slightly modified LED indicator. A real factory can accommodate minor customizations within 7-14 days because they control the production line. A trading company needs weeks because they must relay the request to their supplier. If they claim "no customization available" for any minor change, they are likely not manufacturing.
