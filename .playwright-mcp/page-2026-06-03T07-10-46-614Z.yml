              - paragraph [ref=e390]: "Video audits work well for verifying a factory's existence, basic production capability, and transparency. They cannot replace on-site inspection for: measuring defect rates, verifying working conditions, testing equipment calibration, auditing financial records, or confirming raw material authenticity. For orders above $50,000 or when launching a flagship product line, commission a third-party audit from Bureau Veritas, SGS, TUV, or Intertek. The $300-800 cost is insurance against a failed order."
