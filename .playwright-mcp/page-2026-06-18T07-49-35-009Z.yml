        - generic [ref=e154]:
          - heading "3. How to Evaluate a Semi-Solid-State Supplier" [level=2] [ref=e155]
          - paragraph [ref=e156]: Finding a legitimate manufacturer is harder than it sounds. Several factories claim semi-solid-state capability but are actually shipping enhanced Li-polymer with a marketing label.
          - generic [ref=e157]:
            - generic [ref=e158]:
              - heading "1. Request Cell-Level Test Reports" [level=3] [ref=e159]
              - paragraph [ref=e160]: Ask for cycle life test data at 1C charge/discharge rate (should exceed 500 cycles), thermal runaway test results, energy density measurements, and UN38.3 certification.
            - generic [ref=e161]:
              - heading "2. Ask About Electrolyte Formulation" [level=3] [ref=e162]
              - paragraph [ref=e163]: A legitimate manufacturer should describe their gel polymer electrolyte without hesitation. Look for "in-situ polymerization" or patent filings.
            - generic [ref=e164]:
              - heading "3. Visit or Video Tour the Factory" [level=3] [ref=e165]
              - paragraph [ref=e166]: "\"When Chen-Wei visited his supplier's factory in Shenzhen, he asked to see the electrolyte mixing line. The factory manager showed him a dry room with specialized equipment, not the standard liquid filling line. That's when he knew the technology was real.\""
            - generic [ref=e167]:
              - heading "4. Verify Certifications" [level=3] [ref=e168]
              - paragraph [ref=e169]: Semi-solid-state cells require UN38.3 certification for air shipping. Request the certificate and verify it covers your specific cell model.
          - paragraph [ref=e170]: "Red flags: can't explain cell technology technically, refuses video tour, uncertified test labs, pricing too close to standard Li-polymer."
          - generic [ref=e171]:
