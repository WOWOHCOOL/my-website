          - paragraph [ref=e233]:
            - text: Effective June 2026, China's updated
            - strong [ref=e234]: GB38031-2025
            - text: safety standard now requires portable power banks to pass
            - strong [ref=e235]: nail penetration tests
            - text: with zero fire or explosion. This is a major regulatory tailwind for semi-solid-state technology — conventional Li-polymer batteries struggle to pass this test, while gel electrolyte cells pass it by design.
