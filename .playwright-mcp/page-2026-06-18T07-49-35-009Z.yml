          - heading "1. What Is a Semi-Solid-State Battery?" [level=2] [ref=e84]
          - paragraph [ref=e85]: A semi-solid-state battery replaces the liquid electrolyte found in conventional Li-polymer cells with a gel-like or paste electrolyte. This isn't a full solid-state battery, which uses a solid ceramic electrolyte and isn't yet mass-produced for consumer electronics. It's a hybrid, the best of both worlds.
