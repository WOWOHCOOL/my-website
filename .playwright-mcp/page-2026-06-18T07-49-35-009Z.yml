            - strong [ref=e238]: "What this means for OEM buyers:"
            - text: If you sell into the Chinese market or export from Chinese factories, your products must comply. Semi-solid-state cells inherently meet the nail penetration requirement, eliminating costly re-engineering of Li-polymer products. Brands that switch now avoid last-minute compliance scrambles.
