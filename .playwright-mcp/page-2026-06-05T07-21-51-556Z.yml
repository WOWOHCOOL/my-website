      - generic [ref=e51]:
        - paragraph [ref=e52]: You are looking at GaN chargers from suppliers and seeing "GaN," "GaN III," and "GaN V" thrown around. Some factories label everything as the latest generation. Others just say "GaN" and leave you guessing.
        - paragraph [ref=e53]: If you are sourcing chargers for your brand, the difference between these generations is not academic. It affects your product size by 2x, your return rate by 3x, and how much you can charge at retail.
        - paragraph [ref=e54]: Here is what each generation actually delivers, how to tell them apart, and which one makes sense for your product line.
