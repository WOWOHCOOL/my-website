        - generic [ref=e350]:
          - 'heading "7. Recall Forensics: 5 Case Studies" [level=2] [ref=e351]'
          - paragraph [ref=e352]: "Each recall below has a publicly available CPSC report. The pattern is consistent: a single protection layer was missing, underspecified, or untested — and the failure cascaded."
          - generic [ref=e353]:
            - generic [ref=e354]:
              - generic [ref=e355]:
                - heading "Anker Power Bank Recall (2025)" [level=3] [ref=e356]
                - generic [ref=e357]: ~1M Units
              - paragraph [ref=e358]:
                - text: "Over 1 million power banks recalled after reports of overheating and fires. The root cause: a"
                - strong [ref=e359]: lithium cell manufacturing defect
                - text: (internal short from metallic particle contamination during cell winding) that the BMS failed to detect because it lacked dT/dt monitoring — the temperature rose too fast for the single-point NTC to trigger cutoff before thermal runaway began.
              - paragraph [ref=e360]: "Missing protection: Dual-sensor thermal derating (IEC 62368-1 Ed.3) + cell-level dT/dt detection. A second NTC on the opposite side of the cell would have detected the asymmetric heating."
            - generic [ref=e361]:
              - generic [ref=e362]:
                - heading "VC Group Wireless Power Banks (2025)" [level=3] [ref=e363]
                - generic [ref=e364]: 287K Units
              - paragraph [ref=e365]:
                - text: Recalled after multiple fire incidents. Investigation found the
                - strong [ref=e366]: wireless charging coil's FOD (Foreign Object Detection) was calibrated too loosely
                - text: — metallic objects between the coil and phone caused inductive heating to >200°C, which ignited the plastic enclosure. The enclosure material was rated V-1, not V-0.
              - paragraph [ref=e367]: "Missing protection: Tight FOD calibration + V-0 enclosure. A V-0 enclosure would have self-extinguished before the fire spread beyond the device."
            - generic [ref=e368]:
              - generic [ref=e369]:
                - heading "Quad Lock MAG Case (2025)" [level=3] [ref=e370]
                - generic [ref=e371]: 74K Units
              - paragraph [ref=e372]:
                - text: "MAG wireless charging cases recalled for burn injuries. The failure:"
                - strong [ref=e373]: over-current protection was set too high
                - text: for the Qi coil gauge, allowing the coil to overheat during extended charging sessions. No OTP was present on the receiver side — the thermal protection relied entirely on the transmitter, which had no visibility into the case's coil temperature.
              - paragraph [ref=e374]: "Missing protection: Receiver-side OTP. Wireless power receivers need independent thermal sensing — the transmitter's FOD cannot detect a receiver coil overheating inside a sealed case."
            - generic [ref=e375]:
              - generic [ref=e376]:
                - heading "Casely Power Pod (2025)" [level=3] [ref=e377]
                - generic [ref=e378]: Class Action
              - paragraph [ref=e379]:
                - text: "Class-action lawsuit filed over burn injuries from a MagSafe-compatible power bank. The issue:"
                - strong [ref=e380]: no cell separator walls
                - text: between the three parallel 18650 cells. When one cell experienced internal shorting, the heat propagated to adjacent cells within seconds, creating a cascading thermal runaway event across all three cells simultaneously.
              - paragraph [ref=e381]: "Missing protection: Individual cell separation walls (V-0 material) + per-cell NTC. Parallel cells without physical isolation are a single failure point."
            - generic [ref=e382]:
              - generic [ref=e383]:
                - heading "HTRC / Haisito Battery Chargers (2025)" [level=3] [ref=e384]
                - generic [ref=e385]: 4,800 Units
              - paragraph [ref=e386]:
                - text: 33 reported fires and explosions, 3 injuries, $224,000 property damage. The charger's
                - strong [ref=e387]: voltage feedback loop failed open
                - text: ", causing the output to drift to nearly double the rated voltage. Without independent OVP (the feedback and protection shared the same IC pin), the charger continued delivering over-voltage until the connected battery pack exploded."
              - paragraph [ref=e388]: "Missing protection: Independent OVP. Feedback-loop regulation and over-voltage protection must use separate circuits — sharing a pin creates a single point of failure."
          - paragraph [ref=e389]:
            - text: "The common thread:"
            - strong [ref=e390]: no recall was caused by a single component failure.
            - text: Each was caused by a protection architecture that assumed the component would never fail. Two-fault tolerance — the principle behind IEC 62368-1's HBSE model — would have caught every case above.
