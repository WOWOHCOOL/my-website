            - paragraph [ref=e295]: UL 94 7TH EDITION (FEB 2026)
            - paragraph [ref=e296]:
              - text: The 7th Edition introduces stricter requirements for thin-wall enclosures (<0.8mm). Materials that previously achieved V-1 may fail under the updated test methods. UL 94 markings must now include
              - strong [ref=e297]: both the flame class and the sample thickness
              - text: (e.g., "V-0 @ 0.75mm"). GaN chargers with ultra-slim designs should be re-verified against 7th Edition methods immediately — the thin-wall clause is where we see the most re-test failures.
          - paragraph [ref=e298]:
            - text: Several 2025 charger recalls were traced to
            - strong [ref=e299]: enclosure fire failures
            - text: ": the plastic ignited during internal arcing and continued to burn. In each case, the manufacturer had used recycled or non-V-0 material — sometimes unknowingly, when a material supplier substituted a lower grade. This is why"
            - link "IQC (Incoming Quality Control)" [ref=e300] [cursor=pointer]:
              - /url: /blog/quality-control-guide
            - text: with batch-level burn testing is non-negotiable.
