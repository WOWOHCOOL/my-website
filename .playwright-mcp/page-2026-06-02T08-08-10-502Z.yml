            - paragraph [ref=e251]: WOWOHCOOL INSIGHT
            - paragraph [ref=e252]:
              - text: "Across 200+ brand accounts, the three most common failure points we see are:"
              - strong [ref=e253]: (1) non-V-0 plastics
              - text: that ignite during fault testing,
              - strong [ref=e254]: (2) undersized Y-capacitors
              - text: that fail dielectric strength tests, and
              - strong [ref=e255]: (3) missing NTC on the secondary side
              - text: — the charger has OTP on the primary but is blind to a hot USB-C connector. All three are invisible to the end user until a failure occurs.
