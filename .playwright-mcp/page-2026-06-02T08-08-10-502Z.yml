        - generic [ref=e143]:
          - 'heading "3. Thermal Runaway: How It Happens & How to Prevent It" [level=2] [ref=e144]'
          - paragraph [ref=e145]: "Thermal runaway is the most feared failure mode in any product containing a lithium cell. It is a self-accelerating exothermic chain reaction: once triggered, it cannot be stopped — only contained."
          - generic [ref=e146]:
            - generic [ref=e147]:
              - heading "The Chain Reaction" [level=3] [ref=e148]
              - list [ref=e149]:
                - listitem [ref=e150]:
                  - strong [ref=e151]: "Trigger:"
                  - text: Overcharge, internal short, physical damage, or external heat above 60°C
                - listitem [ref=e152]:
                  - strong [ref=e153]: "SEI decomposition (~80°C):"
                  - text: The solid-electrolyte interphase layer breaks down, exposing fresh lithium to electrolyte
                - listitem [ref=e154]:
                  - strong [ref=e155]: "Electrolyte breakdown (~150°C):"
                  - text: The organic electrolyte decomposes, releasing flammable hydrocarbon gases (H₂, CH₄, C₂H₄)
                - listitem [ref=e156]:
                  - strong [ref=e157]: "Separator melt (~180°C):"
                  - text: The polyolefin separator melts, creating a direct anode-cathode short
                - listitem [ref=e158]:
                  - strong [ref=e159]: "Thermal peak (> 800°C):"
                  - text: All remaining energy discharges in milliseconds — the cell vents flaming gas and can eject its contents
            - generic [ref=e160]:
              - heading "Prevention Architecture" [level=3] [ref=e161]
              - list [ref=e162]:
                - listitem [ref=e163]:
                  - text: —
                  - strong [ref=e164]: NTC thermistor
                  - text: "on the cell body: continuous temperature sampling at 10Hz"
                - listitem [ref=e165]:
                  - text: —
                  - strong [ref=e166]: "MCU charge controller:"
                  - text: terminates charge if dT/dt exceeds 0.5°C/min — a leading indicator of internal shorting
                - listitem [ref=e167]:
                  - text: —
                  - strong [ref=e168]: "Dual-sensor thermal derating (IEC 62368-1:2023 Ed.3):"
                  - text: two independent NTC sensors must agree; if one fails or disagrees by >3°C, the system enters safe mode at 50% power
                - listitem [ref=e169]:
                  - text: —
                  - strong [ref=e170]: "Hard shutdown at 105°C:"
                  - text: a thermal fuse in series with the battery B+ line opens permanently
                - listitem [ref=e171]:
                  - text: —
                  - strong [ref=e172]: "Physical containment:"
                  - text: V-0 rated cell holder with individual cell separation walls
          - generic [ref=e173]:
            - paragraph [ref=e174]: GB 47372-2026 NAIL PENETRATION TEST
            - paragraph [ref=e175]: "China's new GB 47372-2026 standard mandates a nail-penetration test: a Ø3mm steel nail is driven through a fully charged cell at 150mm/s. The cell must not ignite or explode. This test is stricter than UL 2056 or UN38.3 and represents the new high-water mark for power bank safety. Factories that pass it have validated their cell sourcing and BMS design to the most demanding standard in the world."
