        - generic [ref=e81]:
          - heading "1. Why Charger Safety Is Critical in 2026" [level=2] [ref=e82]
          - paragraph [ref=e83]: "Three forces are converging to make 2026 a watershed year for charger safety:"
          - generic [ref=e84]:
            - generic [ref=e85]:
              - generic [ref=e86]: "1."
              - paragraph [ref=e87]:
                - strong [ref=e88]: Regulatory reset.
                - text: IEC 62368-1 Edition 3 enforcement began January 1, 2026 across EU/UK/US markets. Australia and New Zealand follow July 1, 2026. UL 62368-1 4th Edition was published in July 2025 and becomes mandatory February 15, 2027 — but the transition starts now. China's new GB 47372-2026 power bank standard adds nail-penetration and thermal abuse tests, with a transition period ending March 31, 2027.
            - generic [ref=e89]:
              - generic [ref=e90]: "2."
              - paragraph [ref=e91]:
                - strong [ref=e92]: Recall velocity is accelerating.
                - text: Anker recalled over 1 million power banks in 2025 due to fire risk. VC Group recalled 287,000 wireless power banks. Quad Lock recalled 74,000 MAG cases. Casely Power Pod faced a class-action lawsuit over burn injuries. These are not no-name brands — they are market leaders with revenue and reputation at stake.
            - generic [ref=e93]:
              - generic [ref=e94]: "3."
              - paragraph [ref=e95]:
                - strong [ref=e96]: GaN density amplifies risk.
                - text: GaN chargers pack 65W–240W into shells 40% smaller than silicon equivalents. Higher power density means higher thermal stress, which means protection circuits can no longer be an afterthought — they must be architected from the PCB layout stage.
          - generic [ref=e97]:
            - paragraph [ref=e98]: THE COST OF GETTING IT WRONG
            - paragraph [ref=e99]: "A single recall can cost $500,000–$2M in logistics, refunds, legal fees, and brand damage. CPSC recall announcements are permanent and searchable. For context: the average charger certification costs $10,000–$25,000. The math is not close."
