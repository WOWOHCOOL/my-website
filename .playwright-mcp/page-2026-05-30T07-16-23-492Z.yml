      - generic [ref=e150]:
        - 'heading "6. Paso 3: Cómo evaluar la calidad de una fábrica" [level=2] [ref=e151]'
        - paragraph [ref=e152]: "Visitar la fábrica o realizar una auditoría profesional es el paso más importante. Muchos compradores se dejan impresionar por perfiles atractivos en Alibaba. Recomendamos:"
        - list [ref=e153]:
          - listitem [ref=e154]:
            - strong [ref=e155]: "Verificar la certificación ISO 9001:"
            - text: Una certificación ISO 9001 auténtica es una señal sólida de gestión de calidad.
          - listitem [ref=e156]:
            - strong [ref=e157]: "Inspeccionar la superficie de producción:"
            - text: Una planta de 5.000m² con líneas SMT automatizadas es un buen indicador de seriedad.
          - listitem [ref=e158]:
            - strong [ref=e159]: "Preguntar por el número de empleados:"
            - text: Un fabricante establecido tiene entre 200 y 500 empleados. Los talleres pequeños con 10-20 personas suelen tener problemas de calidad.
          - listitem [ref=e160]:
            - strong [ref=e161]: "Solicitar referencias:"
