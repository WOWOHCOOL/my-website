      - generic [ref=e199]:
        - 'heading "8. Paso 5: Cómo solicitar y probar muestras" [level=2] [ref=e200]'
        - paragraph [ref=e201]: "Antes de realizar un pedido grande, solicite siempre muestras. Un fabricante de power banks serio le enviará muestras en un plazo de 3 a 7 días. El coste oscila entre 20 y 100 euros por unidad y, por lo general, se descuenta del primer pedido de producción. Pruebe sistemáticamente:"
        - list [ref=e202]:
          - listitem [ref=e203]:
            - strong [ref=e204]: "Potencia de carga:"
            - text: ¿La potencia real coincide con lo anunciado? Mida con un comprobador USB.
          - listitem [ref=e205]:
            - strong [ref=e206]: "Calidad de fabricación:"
            - text: ¿Las uniones son limpias? ¿El puerto USB está firme? ¿El acabado es profesional?
          - listitem [ref=e207]:
            - strong [ref=e208]: "Seguridad:"
            - text: ¿La power bank se calienta demasiado bajo carga continua? ¿Disponen de circuitos de protección?
          - listitem [ref=e209]:
            - strong [ref=e210]: "Certificaciones:"
            - text: ¿Las marcas CE y RoHS están visibles? ¿Los informes de ensayo están disponibles?
          - listitem [ref=e211]:
            - strong [ref=e212]: "Compatibilidad:"
            - text: "Pruebe con varios dispositivos: iPhone, Samsung, MacBook, etc."
        - paragraph [ref=e213]: Documente los resultados con fotos. Si hay desviaciones, envíe las evidencias al fabricante y exija correcciones antes de aprobar la producción en serie.
      - generic [ref=e214]:
        - 'heading "9. Paso 6: El proceso de control de calidad" [level=2] [ref=e215]'
        - paragraph [ref=e216]: "Un fabricante de power banks profesional dispone de un proceso de control de calidad en varias etapas: IQC (control de materiales entrantes), IPQC (control durante la producción), FQC (control final) y OQC (control de salida). Pregunte a su fabricante por estos procesos. Un buen indicador es una tasa de defectos baja: por debajo del 0,3% es el estándar del sector para fabricantes consolidados."
        - paragraph [ref=e217]: Especialmente importante es la prueba de envejecimiento (aging test). Las power banks se someten a carga máxima durante varias horas para identificar celdas débiles o problemas en la electrónica de carga. Una prueba de envejecimiento de 4 horas es el estándar entre los fabricantes de calidad. Pregunte siempre si y durante cuánto tiempo se prueban sus power banks antes del envío.
        - paragraph [ref=e218]: También recomendamos contratar una inspección externa. Empresas como SGS, TÜV Rheinland o Bureau Veritas ofrecen servicios de inspección en China. Un inspector de calidad puede realizar un muestreo antes del envío y verificar que los productos cumplen sus especificaciones. El coste de 300-600 euros por inspección es dinero bien invertido.
      - generic [ref=e219]:
        - heading "10. Costes de un proyecto OEM de power banks" [level=2] [ref=e220]
        - paragraph [ref=e221]: "La estructura de precios de los fabricantes chinos puede resultar compleja para los importadores noveles. Estos son los componentes principales:"
        - list [ref=e222]:
          - listitem [ref=e223]:
            - strong [ref=e224]: "Precio unitario:"
            - text: "El precio del producto, muy dependiente del volumen. Rango típico: 5-20 EUR por power bank (10.000-20.000 mAh) para pedidos de 500-1.000 unidades."
          - listitem [ref=e225]:
            - strong [ref=e226]: "Costes de moldes (tooling):"
            - text: Para proyectos ODM, los costes de moldes oscilan entre 1.000 y 5.000 EUR, a menudo amortizados en el primer pedido.
          - listitem [ref=e227]:
            - strong [ref=e228]: "Embalaje:"
            - text: El embalaje personalizado cuesta entre 0,50 y 2 EUR por unidad, según la complejidad y los materiales.
          - listitem [ref=e229]:
            - strong [ref=e230]: "Envío:"
            - text: "DHL/FedEx exprés: aproximadamente 3-5 EUR por unidad. El transporte marítimo es más económico pero más lento."
        - paragraph [ref=e231]: Las condiciones de pago habituales son 30% de anticipo al confirmar el pedido y 70% antes del envío (T/T). Para socios B2B verificados, algunos fabricantes ofrecen condiciones especiales. Negocie siempre los INCOTERMS (EXW, FOB, CIF o DDP). Para quienes empiezan, DDP es la opción más cómoda, ya que el fabricante gestiona todos los trámites aduaneros.
      - generic [ref=e232]:
        - 'heading "11. Paso 7: Envío y logística a España" [level=2] [ref=e233]'
        - paragraph [ref=e234]: "El envío de power banks está sujeto a normativas especiales debido a las baterías de litio. La certificación UN38.3 es obligatoria para el transporte aéreo. Para importadores españoles recomendamos:"
        - list [ref=e235]:
          - listitem [ref=e236]:
            - strong [ref=e237]: "Envío exprés (DHL/FedEx):"
            - text: 5-7 días, ideal para muestras y pedidos pequeños.
          - listitem [ref=e238]:
            - strong [ref=e239]: "Carga aérea:"
            - text: 7-14 días, para pedidos medianos.
          - listitem [ref=e240]:
            - strong [ref=e241]: "Transporte marítimo:"
            - text: 25-35 días, la opción más económica para grandes volúmenes.
        - paragraph [ref=e242]: El servicio DDP (Delivered Duty Paid) es especialmente recomendable para principiantes, ya que el fabricante se encarga de toda la gestión aduanera. Pregunte a su fabricante de power banks por condiciones DDP. Tenga en cuenta el IVA de importación del 21% en España. Con DDP, este impuesto ya está incluido en el precio, lo que simplifica enormemente el proceso.
        - img "Equipo WOWOHCOOL en la planta de producción de power banks" [ref=e243]
      - generic [ref=e244]:
        - heading "12. Errores comunes al importar desde China" [level=2] [ref=e245]
        - paragraph [ref=e246]: "Muchos importadores hispanos cometen errores similares en su primera experiencia con fabricantes chinos. Estos son los más frecuentes y cómo evitarlos:"
        - list [ref=e247]:
          - listitem [ref=e248]:
            - strong [ref=e249]: "Apresurarse en el primer pedido:"
            - text: Tómese el tiempo necesario para investigar y solicite siempre muestras antes de hacer un pedido grande. Un buen fabricante no le presionará.
          - listitem [ref=e250]:
            - strong [ref=e251]: "Fijarse solo en el precio:"
            - text: El proveedor más barato rara vez es el mejor. Valore la calidad, la comunicación y las referencias. Un precio unitario ligeramente más alto se amortiza con menos reclamaciones.
          - listitem [ref=e252]:
            - strong [ref=e253]: "No formalizar acuerdos por escrito:"
            - text: Documente todas las especificaciones, precios y plazos de entrega por escrito. Los acuerdos verbales suelen generar malentendidos.
          - listitem [ref=e254]:
            - strong [ref=e255]: "No verificar las certificaciones:"
            - text: Solicite los certificados antes del pedido y compruebe su validez. Los certificados falsos son un problema conocido en China.
          - listitem [ref=e256]:
            - strong [ref=e257]: "Subestimar los costes logísticos:"
            - text: El transporte representa a menudo el 10-20% del coste total. Solicite un presupuesto completo que incluya el envío antes de decidir.
      - generic [ref=e258]:
        - heading "13. Casos de éxito en el mercado hispano" [level=2] [ref=e259]
        - paragraph [ref=e260]: "Cada vez más marcas españolas y latinoamericanas fabrican sus power banks en China. Un ejemplo: un importador español comenzó con 500 unidades de una power bank OEM y, dos años después, vende más de 10.000 unidades al año bajo su propia marca. La incertidumbre inicial se convirtió rápidamente en entusiasmo al recibir las primeras valoraciones positivas de sus clientes."
        - paragraph [ref=e261]: Otro caso es el de una empresa mexicana de electrónica que encargó un desarrollo ODM de una power bank Semi-Solid-State. Tras 60 días de desarrollo y pruebas exhaustivas, el producto entró en producción. Hoy es uno de los artículos más vendidos de su categoría. La clave del éxito fue la colaboración estrecha durante toda la fase de desarrollo.
      - generic [ref=e262]:
        - heading "14. Cómo superar la barrera del idioma" [level=2] [ref=e263]
        - paragraph [ref=e264]: "La comunicación con los fabricantes chinos es uno de los mayores desafíos para los importadores hispanos. La mayoría de los fabricantes de power banks tienen personal comercial que habla inglés, pero los detalles técnicos a veces se malinterpretan. Nuestro consejo: todas las conversaciones importantes deben quedar documentadas por escrito (correo electrónico). Utilice imágenes, croquis y dibujos técnicos para transmitir sus ideas con claridad."
        - paragraph [ref=e265]: Un buen fabricante responderá a su consulta en un plazo de 24 horas. Si las respuestas son vagas o evasivas, es una señal de alerta. Las respuestas transparentes y detalladas son señal de profesionalidad. Intente comunicarse siempre con la misma persona de contacto; los cambios frecuentes de interlocutor generan malentendidos.
        - paragraph [ref=e266]: En WOWOHCOOL ofrecemos atención en español, lo que elimina por completo la barrera idiomática. Nuestro equipo comercial hispanohablante le guiará en todo el proceso, desde la selección del producto hasta la entrega.
      - generic [ref=e267]:
        - heading "15. Conclusión" [level=2] [ref=e268]
        - paragraph [ref=e269]: Elegir al fabricante de power banks adecuado en China es una de las decisiones más importantes para su marca. Tómese el tiempo necesario para investigar, solicite muestras y, si es posible, visite la fábrica o concierte una videollamada. Un buen fabricante se comunicará de forma transparente, le proporcionará referencias y se adaptará a sus necesidades específicas.
        - paragraph [ref=e270]: El mercado de power banks en España y Latinoamérica sigue creciendo, impulsado por el aumento del uso de dispositivos móviles y la demanda de mayor potencia de carga. Con el socio adecuado, puede aprovechar este crecimiento y construir una marca propia exitosa.
