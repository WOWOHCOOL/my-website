      - generic [ref=e97]:
        - heading "1. Por qué importar power banks desde China" [level=2] [ref=e98]
        - paragraph [ref=e99]: China es el mayor productor mundial de power banks y cargadores portátiles. Más del 80% de la producción global de power banks se concentra en Shenzhen y sus alrededores, la misma región donde WOWOHCOOL fabrica desde 2013. Para las empresas españolas y latinoamericanas que quieren vender power banks con su propia marca, China es la opción más competitiva.
        - paragraph [ref=e100]: "Las ventajas son evidentes: costes de producción más bajos, una amplísima variedad de fabricantes especializados y plazos de entrega rápidos para prototipos. Sin embargo, la gran cantidad de proveedores disponibles, desde pequeños talleres hasta fábricas certificadas ISO 9001 con miles de empleados, hace que la elección del socio adecuado sea crucial."
        - paragraph [ref=e101]: Esta guía está diseñada específicamente para importadores de España y Latinoamérica que buscan fabricar power banks en China por primera vez. Le explicamos paso a paso todo lo que debe saber, desde la primera consulta hasta la entrega de su power bank personalizada.
      - generic [ref=e102]:
        - 'heading "2. Shenzhen: el centro mundial de la producción de power banks" [level=2] [ref=e103]'
        - paragraph [ref=e104]: Shenzhen, en el sur de China, se ha convertido en las últimas décadas en el centro de fabricación electrónica más importante del mundo. La ciudad alberga más de 5.000 proveedores de componentes, fabricantes de baterías y plantas de ensamblaje. China produce aproximadamente el 90% de todas las power banks y cargadores del mundo, con un valor de exportación estimado en 15.000 millones de dólares anuales. Para un fabricante de power banks, esto significa cadenas de suministro ultracortas, desarrollo rápido de prototipos y mano de obra altamente cualificada.
        - paragraph [ref=e105]: "Además, Shenzhen concentra una gran cantidad de talento en I+D. Muchos fabricantes de power banks tienen equipos de ingeniería de 20 a 50 personas capaces de desarrollar nuevos productos en tiempo récord. Lo que en Europa podría llevar semanas, en Shenzhen a menudo se logra en días. Pero no todos los fabricantes trabajan con el mismo nivel de calidad: la selección del socio adecuado marca la diferencia entre el éxito y los problemas."
      - generic [ref=e106]:
        - heading "3. Certificaciones necesarias para el mercado español" [level=2] [ref=e107]
        - paragraph [ref=e108]: Antes de vender power banks en España o en la Unión Europea, debe asegurarse de que su producto cumple con todas las certificaciones obligatorias. Las autoridades aduaneras y los grandes distribuidores exigen la documentación completa. La falta de certificaciones puede provocar retenciones en aduana, retiradas del mercado e incluso sanciones legales.
        - list [ref=e109]:
          - listitem [ref=e110]:
            - strong [ref=e111]: "Marcado CE:"
            - text: Obligatorio para el mercado europeo. Certifica que el producto cumple con los requisitos esenciales de seguridad y salud de la UE. El fabricante debe emitir una declaración de conformidad y mantener la documentación técnica.
          - listitem [ref=e112]:
            - strong [ref=e113]: "RoHS:"
            - text: Directiva que restringe el uso de sustancias peligrosas como plomo, mercurio y cadmio en equipos eléctricos. Obligatorio para el mercado español.
          - listitem [ref=e114]:
            - strong [ref=e115]: "UN38.3:"
            - text: Certificación obligatoria para el transporte de baterías de litio. Sin ella, las power banks no pueden enviarse por vía aérea ni marítima.
          - listitem [ref=e116]:
            - strong [ref=e117]: "Reglamento UE 2023/1542:"
            - text: Desde agosto de 2025, todas las power banks deben cumplir el nuevo reglamento europeo de baterías. Incluye registro EPR en España, representante autorizado en la UE y documentación de trazabilidad.
        - img "Power bank Semi-Solid-State con cable retráctil" [ref=e118]
      - generic [ref=e119]:
        - 'heading "4. Paso 1: Defina los requisitos de su power bank" [level=2] [ref=e120]'
        - paragraph [ref=e121]: "Antes de comenzar la búsqueda, debe tener claros sus propios requisitos. Los importadores hispanos a menudo cometen el error de buscar de forma demasiado genérica. Concrete:"
        - list [ref=e122]:
          - listitem [ref=e123]:
            - strong [ref=e124]: "Capacidad:"
            - text: ¿5.000 mAh para uso diario o 20.000 mAh para usuarios intensivos?
          - listitem [ref=e125]:
            - strong [ref=e126]: "Potencia de carga:"
            - text: ¿20W PD son suficientes o necesita 140W PD 3.1 para portátiles?
          - listitem [ref=e127]:
            - strong [ref=e128]: "Cantidad:"
            - text: ¿Cuántas unidades por pedido? El volumen afecta significativamente al precio unitario.
          - listitem [ref=e129]:
            - strong [ref=e130]: "Certificaciones:"
            - text: CE, RoHS y UN38.3 son obligatorias. Para el canal retail en España, AENOR es un plus.
          - listitem [ref=e131]:
            - strong [ref=e132]: "Presupuesto:"
            - text: ¿Precio objetivo por unidad? ¿Incluye o excluye embalaje?
        - paragraph [ref=e133]:
          - text: Explore nuestra
          - link "gama de power banks" [ref=e134] [cursor=pointer]:
            - /url: /es/productos/powerbank
          - text: para ver qué modelos se adaptan a su proyecto.
        - generic [ref=e135]:
          - 'heading "FAQ: ¿Qué debe tener un buen fabricante de power banks?" [level=3] [ref=e136]'
          - paragraph [ref=e137]: Un fabricante de power banks fiable en China debe contar con certificación ISO 9001, una planta de producción propia de al menos 5.000m² y referencias verificables de clientes europeos. Para el mercado español, las certificaciones CE, RoHS, UN38.3 y el cumplimiento del Reglamento UE 2023/1542 son imprescindibles. Un fabricante experimentado ofrece un proceso de control de calidad de 4 etapas con una tasa de defectos inferior al 0,3%.
      - generic [ref=e138]:
        - 'heading "5. Paso 2: Cómo buscar y comparar fabricantes" [level=2] [ref=e139]'
        - paragraph [ref=e140]: "Existen varias formas de encontrar fabricantes de power banks en China. Las más habituales son:"
        - list [ref=e141]:
          - listitem [ref=e142]:
            - strong [ref=e143]: "Plataformas B2B:"
            - text: Alibaba, Made-in-China y Global Sources son las más conocidas. Busque el distintivo "Verified Supplier" y la membresía Gold.
          - listitem [ref=e144]:
            - strong [ref=e145]: "Ferias internacionales:"
            - text: La Canton Fair en Guangzhou y la Global Sources Electronics Fair en Hong Kong ofrecen contacto directo con cientos de fabricantes.
          - listitem [ref=e146]:
            - strong [ref=e147]: "Recomendaciones:"
            - text: Pregunte en su red de contactos. Otros importadores españoles suelen compartir sus experiencias.
        - paragraph [ref=e148]: "Compare al menos 3-5 fabricantes antes de tomar una decisión. No se fije solo en el precio: valore la rapidez de la comunicación, el conocimiento técnico y la flexibilidad para adaptarse a sus necesidades."
