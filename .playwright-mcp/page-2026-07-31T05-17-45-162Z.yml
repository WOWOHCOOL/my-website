        - heading "1. Métricas clave que todo importador debe evaluar" [level=2] [ref=f9e100]
        - paragraph [ref=f9e101]:
          - text: Antes de entrar en detalles técnicos, evalúa estos
          - strong [ref=f9e102]: cinco indicadores cuantitativos
          - text: "del perfil del proveedor. Son datos públicos en Alibaba y plataformas B2B que predicen la fiabilidad mejor que cualquier certificado:"
