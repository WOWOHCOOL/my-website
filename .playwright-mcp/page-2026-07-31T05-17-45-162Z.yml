            - text: el proveedor "barato" suele ser el más caro con defectos y retrabajos
          - listitem [ref=f9e69]:
            - strong [ref=f9e70]: "CCC + GB 47372-2026:"
            - text: nuevas normas chinas que afectan directamente a importadores en 2026
