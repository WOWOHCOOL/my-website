        - paragraph [ref=f9e142]:
          - strong [ref=f9e143]: La tasa de recompra es el indicador más honesto.
          - text: Un proveedor puede maquillar fotos y comprar certificaciones, pero los clientes no vuelven a comprar si el producto falla. WOWOHCOOL mantiene una tasa de recompra superior al 85% con clientes B2B — cada dato cuenta una historia.
        - 'heading "2. Fábrica vs trading company: la distinción crítica" [level=2] [ref=f9e144]'
        - paragraph [ref=f9e145]: "La trampa más habitual para importadores españoles y latinoamericanos: comprar a una trading company que se presenta como fabricante. En Alibaba la diferencia es casi imperceptible — los escaparates profesionales de las trading companies suelen estar mejor diseñados que los de fábricas reales. Pero el impacto en tus costes y control de calidad es enorme: las trading companies añaden un margen del 8–15% sin que tengas influencia técnica sobre la producción."
        - heading "Cuatro indicadores fiables" [level=3] [ref=f9e146]
        - list [ref=f9e147]:
          - listitem [ref=f9e148]:
            - strong [ref=f9e149]: "Licencia comercial china (Business License):"
            - text: Los fabricantes reales declaran «fabricación» como objeto social. Las trading companies indican «comercio» o «servicios técnicos». Pide siempre la licencia — es pública en el sistema nacional chino de información empresarial (gsxt.gov.cn). Un proveedor serio te la enviará sin objeciones en cuestión de horas.
          - listitem [ref=f9e150]:
            - strong [ref=f9e151]: "Capital social registrado:"
            - text: Los fabricantes suelen tener ≥1 millón de RMB de capital, frecuentemente 5–10 millones. Las trading companies declaran 100.000–500.000 RMB. WOWOHCOOL (Dong Yi Technology Co., Ltd) tiene 5,1 M RMB de capital registrado.
          - listitem [ref=f9e152]:
            - strong [ref=f9e153]: "Ubicación:"
            - text: Las fábricas reales están en zonas industriales (Shenzhen Longhua, Bao'an, Dongguan, Huizhou). Las trading companies operan desde edificios de oficinas en Luohu o Futian. Google Maps Street View ayuda a verificar.
          - listitem [ref=f9e154]:
            - strong [ref=f9e155]: "Número de empleados:"
            - text: Una fábrica de cargadores con capacidad >100.000 unidades/mes tiene realísticamente 80–300 empleados. Las trading companies operan con 5–15 personas. Esta cifra suele aparecer en LinkedIn y en la presentación corporativa.
        - blockquote [ref=f9e156]: Una trading company no puede modificar la calidad del producto. Si llegan defectos del 5% en el primer contenedor, no podrá actuar — porque la fábrica real no es suya.
        - heading "3. Verificar la membresía WPC y Qi2" [level=2] [ref=f9e157]
        - paragraph [ref=f9e158]: Quien venda cargadores inalámbricos con logo Qi o marca Qi2 debe ser miembro del Wireless Power Consortium (WPC). De lo contrario, la comercialización es ilegal — la vigilancia del mercado puede ordenar retirada inmediata; para los programas Apple MFi o Made-for-Pixel de Google la certificación Qi2 es directamente requisito.
        - paragraph [ref=f9e159]:
          - strong [ref=f9e160]: "Cómo verificar la membresía en 60 segundos:"
        - list [ref=f9e161]:
          - listitem [ref=f9e162]:
            - text: Abre
            - link "wirelesspowerconsortium.com/find-members" [ref=f9e163] [cursor=pointer]:
              - /url: https://www.wirelesspowerconsortium.com/find-members
          - listitem [ref=f9e164]: Busca el nombre registrado de la empresa (no la marca).
          - listitem [ref=f9e165]: "Para productos Qi2: consulta también la base de datos específica Qi2 — cada modelo tiene un ID WPC propio."
          - listitem [ref=f9e166]: Solicita al proveedor el Member ID y el Model ID para cruzar la información.
        - paragraph [ref=f9e167]:
          - text: WOWOHCOOL es miembro WPC desde 2018 (Member ID bajo petición) con actualmente 47 modelos certificados Qi2 y una tasa de éxito ATL del 99,2%. Más detalle en la
          - link "guía de certificación Qi2" [ref=f9e168] [cursor=pointer]:
            - /url: /es/blog/certificacion-qi2-importadores/
          - text: .
        - 'heading "4. FOD: el test técnico más importante" [level=2] [ref=f9e169]'
        - paragraph [ref=f9e170]:
          - text: Foreign Object Detection (FOD) es el mecanismo que detecta objetos metálicos entre el cargador inalámbrico y el smartphone. Una moneda o una llave pueden calentarse a más de 80°C al cargar inalámbricamente y provocar incendios. El FOD deficiente es
          - strong [ref=f9e171]: la principal causa de devoluciones
          - text: en cargadores inalámbricos y un foco directo de la vigilancia del mercado en España y Alemania.
        - paragraph [ref=f9e172]:
          - strong [ref=f9e173]: "Cómo probar FOD en una muestra:"
        - list [ref=f9e174]:
          - listitem [ref=f9e175]: Coloca una moneda de 1 céntimo, una llave de casa o un clip metálico sobre la zona de carga.
          - listitem [ref=f9e176]: Un cargador correcto se apaga en 1–3 segundos y muestra una advertencia LED.
          - listitem [ref=f9e177]: Repite con distintos metales (aluminio, acero inoxidable, hierro) — los cargadores Qi2 MPP deben detectar los tres con fiabilidad.
          - listitem [ref=f9e178]: Mantén el test durante una hora en bucle. Los algoritmos débiles fallan bajo deriva térmica.
        - paragraph [ref=f9e179]:
          - text: Una fábrica seria proporciona, a petición, un
          - strong [ref=f9e180]: informe FOD según Qi 2.0 v1.3.1
          - text: . Quien no lo tiene es porque nunca lo ha hecho profesionalmente.
        - heading "5. Calidad de bobina y gestión térmica" [level=2] [ref=f9e181]
        - paragraph [ref=f9e182]: "La bobina es el corazón de un cargador inalámbrico. Las bobinas baratas, con hilo de cobre delgado y ferrita insuficiente, generan tres problemas: rendimiento pobre (>30% de pérdidas), puntos calientes en el móvil y fallo prematuro tras 6–12 meses de uso."
        - heading "Calidad de bobina — qué comprobar" [level=3] [ref=f9e183]
        - list [ref=f9e184]:
          - listitem [ref=f9e185]:
            - strong [ref=f9e186]: "Hilo Litz:"
            - text: Mínimo 27 hilos de 0,1 mm. Cobre macizo, no aluminio recubierto de cobre (CCA). El CCA es señal inequívoca de producto barato.
          - listitem [ref=f9e187]:
            - strong [ref=f9e188]: "Blindaje de ferrita:"
            - text: Ferrita NiZn o MnZn con permeabilidad μᵢ ≥1.500. Sin blindaje, la carcasa del móvil actúa como antena e interfiere con NFC y pagos contactless.
          - listitem [ref=f9e189]:
            - strong [ref=f9e190]: "Imanes N52H de neodimio (para Qi2 MPP):"
            - text: Al menos 52 MGOe de densidad de energía. Los imanes deben alinearse correctamente con la geometría MagSafe de Apple, de lo contrario hay pérdidas de alineación superiores al 15%.
        - heading "Gestión térmica" [level=3] [ref=f9e191]
        - list [ref=f9e192]:
          - listitem [ref=f9e193]:
            - strong [ref=f9e194]: Placa de aluminio
            - text: bajo la bobina — disipa el calor hacia los bordes de la carcasa.
          - listitem [ref=f9e195]:
            - strong [ref=f9e196]: Sensor termistor
            - text: en la PCBA que reduce potencia a 60°C y apaga a 75°C.
          - listitem [ref=f9e197]:
            - strong [ref=f9e198]: Carcasa UL 94 V-0
            - text: — autoextinguible, sin PVC ni material reciclado.
        - heading "6. Líneas SMT y calidad PCBA" [level=2] [ref=f9e199]
        - paragraph [ref=f9e200]: La línea SMT (Surface Mount Technology) es la espina dorsal de la fabricación moderna de electrónica. Una fábrica con tres o más líneas SMT tiene una capacidad mensual de >500.000 unidades y puede gestionar pedidos grandes con fiabilidad.
        - paragraph [ref=f9e201]:
          - strong [ref=f9e202]: "Qué buscar en la auditoría por vídeo:"
        - list [ref=f9e203]:
          - listitem [ref=f9e204]: "Equipamiento SMT de marca: Panasonic NPM, Yamaha YS24X o Samsung SM471 — no líneas sin marca de mercado paralelo."
          - listitem [ref=f9e205]: Inspección AOI (Automatic Optical Inspection) tras cada ola de soldadura — defectos detectados en tiempo real.
          - listitem [ref=f9e206]: Inspección por rayos X para componentes BGA en productos premium (chips GaN, controladores USB-PD).
          - listitem [ref=f9e207]: "Limpieza: alfombrillas ESD, ropa ESD, herramientas con toma a tierra ESD. Líneas sucias son motivo claro de descalificación."
