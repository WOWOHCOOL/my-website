        - 'heading "8. CCC y GB 47372-2026: nuevas normas chinas que afectan tu compra" [level=2] [ref=f9e262]'
        - paragraph [ref=f9e263]: "En 2026, China ha endurecido significativamente la regulación de power banks y cargadores. Dos normas afectan directamente a cualquier importador que compre en China:"
        - heading "CCC — Certificación Obligatoria China para Power Banks" [level=3] [ref=f9e264]
        - paragraph [ref=f9e265]:
          - text: Desde
          - strong [ref=f9e266]: agosto de 2024
          - text: ", todos los power banks vendidos en China deben llevar la marca CCC (China Compulsory Certification). A partir del"
          - strong [ref=f9e267]: 1 de marzo de 2026
          - text: ", cada power bank recién certificado debe incluir un"
          - strong [ref=f9e268]: código QR de trazabilidad único
          - text: junto a la marca CCC. La marca debe estar
          - strong [ref=f9e269]: grabada o impresa permanentemente
          - text: en el dispositivo — las pegatinas no son aceptables. Esto afecta a cualquier power bank que se fabrique en China, incluso si es para exportación, porque la fábrica necesita la certificación CCC para operar legalmente.
        - heading "GB 47372-2026 — Nueva norma de seguridad para baterías de litio" [level=3] [ref=f9e270]
        - paragraph [ref=f9e271]:
          - text: Publicada el
          - strong [ref=f9e272]: 31 de marzo de 2026
          - text: con implementación obligatoria antes del
          - strong [ref=f9e273]: 1 de abril de 2027
          - text: ". Esta norma introduce requisitos mucho más estrictos:"
        - list [ref=f9e274]:
          - listitem [ref=f9e275]:
            - strong [ref=f9e276]: "Prueba de penetración con clavo:"
            - text: la celda debe soportar un clavo de 3 mm sin incendio ni explosión.
          - listitem [ref=f9e277]:
            - strong [ref=f9e278]: "Detección de litio depositado:"
            - text: prohibición explícita de celdas con dendritas de litio (causa principal de incendios en power banks).
          - listitem [ref=f9e279]:
            - strong [ref=f9e280]: "Prohibición de celdas reacondicionadas:"
            - text: trazabilidad obligatoria desde el fabricante de celda original.
          - listitem [ref=f9e281]:
            - strong [ref=f9e282]: "Prueba de abuso térmico:"
            - text: exposición a 135°C durante 60 minutos sin fuga térmica.
        - paragraph [ref=f9e283]:
          - text: "Para un importador, esto significa:"
          - strong [ref=f9e284]: verifica que tu proveedor conozca GB 47372-2026 y esté adaptando sus productos
          - text: . Si la fábrica no ha oído hablar de esta norma en julio de 2026, busca otro proveedor. WOWOHCOOL ya está certificando sus power banks bajo GB 47372-2026 con laboratorios acreditados CNAS.
        - 'heading "9. Auditoría: presencial vs por vídeo" [level=2] [ref=f9e285]'
        - paragraph [ref=f9e286]: Una visita presencial a Shenzhen cuesta 2.500–4.000 € y supone 5–7 días de tu agenda. Para la mayoría de importadores no tiene sentido en el primer pedido. Una auditoría por vídeo bien estructurada (1–2 horas en vivo con el responsable de planta por WhatsApp Video o WeChat) aporta el 80% de la información de auditoría — y no cuesta nada.
        - heading "Checklist de auditoría por vídeo" [level=3] [ref=f9e287]
        - list [ref=f9e288]:
          - listitem [ref=f9e289]:
            - strong [ref=f9e290]: "Entrada y placa de fábrica:"
            - text: Cotejar con la Business License y Google Maps.
          - listitem [ref=f9e291]:
            - strong [ref=f9e292]: "Líneas SMT:"
            - text: Al menos 2–3 líneas activas con producción en curso.
          - listitem [ref=f9e293]:
            - strong [ref=f9e294]: "Almacén:"
            - text: Zona IQC de entrada, almacenamiento en seco para componentes sensibles a humedad.
          - listitem [ref=f9e295]:
            - strong [ref=f9e296]: "Laboratorio de envejecimiento:"
            - text: Al menos 1.000 puertos de prueba, burn-in a plena carga de 4 horas.
          - listitem [ref=f9e297]:
            - strong [ref=f9e298]: "Zonas de QC:"
            - text: Equipo Hi-Pot, bancos de prueba funcional, equipo de pre-test CEM.
          - listitem [ref=f9e299]:
            - strong [ref=f9e300]: "Embalaje y envío:"
            - text: Estación de drop test, prensa de cartón, zona de envío Amazon FBA.
        - heading "Visita presencial — cuándo tiene sentido" [level=3] [ref=f9e301]
        - list [ref=f9e302]:
          - listitem [ref=f9e303]: Volumen de pedido >100.000 € por lote
          - listitem [ref=f9e304]: Proyecto ODM con inversión en moldes >5.000 €
          - listitem [ref=f9e305]: Antes de firmar un acuerdo anual de suministro
          - listitem [ref=f9e306]: Ante litigios o reclamaciones que no se resuelven por vídeo
        - heading "10. Evaluación de muestras en 5 pasos" [level=2] [ref=f9e307]
        - paragraph [ref=f9e308]: Las muestras son la señal más valiosa antes del pedido grande. Una fábrica seria entrega muestras estándar en 3–7 días y muestras personalizadas en 10–14 días. El coste de la muestra (50–200 €) es habitual y se descuenta del pedido final.
        - list [ref=f9e309]:
          - listitem [ref=f9e310]:
            - strong [ref=f9e311]: "Inspección visual:"
            - text: Costuras, pintura, impresión — ¿hay rebabas, manchas o logotipos irregulares?
          - listitem [ref=f9e312]:
            - strong [ref=f9e313]: "Prueba funcional:"
            - text: Carga a plena potencia durante 30 minutos, medición de voltaje, test FOD.
          - listitem [ref=f9e314]:
            - strong [ref=f9e315]: "Prueba térmica:"
            - text: La temperatura superficial no debe superar 70°C a 25°C ambiente.
          - listitem [ref=f9e316]:
            - strong [ref=f9e317]: "Drop test:"
            - text: Caída de 1 m sobre suelo duro — la bobina inalámbrica no debe desalinearse.
          - listitem [ref=f9e318]:
            - strong [ref=f9e319]: "Documentación:"
            - text: DoC CE, informes de ensayo, BOM (Bill of Materials) y esquema bajo petición.
        - paragraph [ref=f9e320]:
          - text: Envía siempre las muestras a tu
          - strong [ref=f9e321]: dirección comercial real
          - text: en España o LATAM, no a un intermediario. Incluso un error en la etiqueta de envío revela si el proveedor tiene experiencia exportando a tu mercado.
        - 'heading "11. Costo total landed: por qué el precio unitario engaña" [level=2] [ref=f9e322]'
        - paragraph [ref=f9e323]: "El error de principiante más común: comparar proveedores solo por el precio unitario FOB. El precio más bajo casi siempre es el más caro cuando sumas defectos, retrabajos y retrasos. Ejemplo real con módulos Bluetooth:"
        - table [ref=f9e325]:
          - rowgroup [ref=f9e326]:
            - row [ref=f9e327]:
              - columnheader "Factor" [ref=f9e328]
              - columnheader "Proveedor \"barato\"" [ref=f9e329]
              - columnheader "Proveedor \"caro\"" [ref=f9e330]
          - rowgroup [ref=f9e331]:
            - row [ref=f9e332]:
              - cell "Precio unitario" [ref=f9e333]
              - cell "2,00 $" [ref=f9e334]
              - cell "2,50 $" [ref=f9e335]
            - row [ref=f9e336]:
              - cell "MOQ" [ref=f9e337]
              - cell "5.000 unidades" [ref=f9e338]
              - cell "300 unidades" [ref=f9e339]
            - row [ref=f9e340]:
              - cell "Tasa de defectos" [ref=f9e341]
              - cell "1,8%" [ref=f9e342]
              - cell "0,3%" [ref=f9e343]
            - row [ref=f9e344]:
              - cell [ref=f9e345]:
                - strong [ref=f9e346]: Costo real landed por unidad
              - cell [ref=f9e347]:
                - strong [ref=f9e348]: 2,48 $
                - text: (con retrabajos)
              - cell [ref=f9e349]:
                - strong [ref=f9e350]: 2,55 $
                - text: (alto rendimiento)
        - paragraph [ref=f9e351]:
          - text: La diferencia real es de solo 0,07 $ por unidad, pero el proveedor "caro" te da un MOQ 16× menor, casi cero defectos y flexibilidad para empezar con pedidos pequeños.
          - strong [ref=f9e352]: "El costo total de propiedad incluye:"
          - text: flete, aranceles, costo de retrabajo/scrap, costo de inventario y el tiempo administrativo de gestionar problemas de calidad. Un cargador de 5 € FOB puede costar 12 € puesto en tu almacén si sumas todos estos factores.
        - paragraph [ref=f9e353]:
          - text: WOWOHCOOL publica sus precios FOB reales por nivel de volumen en
          - link "su catálogo para importadores" [ref=f9e354] [cursor=pointer]:
            - /url: /es/contacto/
          - text: ". Sin sorpresas: el precio que ves incluye el control de calidad de 4 fases y la prueba de envejecimiento al 100%."
        - heading "12. Comunicación y zonas horarias" [level=2] [ref=f9e355]
        - paragraph [ref=f9e356]: "La comunicación con proveedores chinos es el factor de éxito que más se subestima. Consejos tras 10 años de exportación a mercados hispanohablantes:"
        - list [ref=f9e357]:
          - listitem [ref=f9e358]:
            - strong [ref=f9e359]: "Nivel de idioma:"
            - text: El Sales Manager debe dominar inglés de negociación (CEFR B2+). El español es raro y no imprescindible, pero un plus claro — WOWOHCOOL cuenta con personal hispanohablante en su equipo de cuentas internacionales.
          - listitem [ref=f9e360]:
            - strong [ref=f9e361]: "Tiempo de respuesta:"
            - text: Los proveedores premium responden en menos de 4 horas laborables (horario Pekín, equivalente a 3–11h CET / 21–05h hora México). Un account manager dedicado responde habitualmente en menos de 2 horas.
          - listitem [ref=f9e362]:
            - strong [ref=f9e363]: "Documentación:"
            - text: Todas las especificaciones por escrito — el histórico de email es la prueba con mayor peso jurídico en China.
          - listitem [ref=f9e364]:
            - strong [ref=f9e365]: "Herramientas:"
            - text: WhatsApp para comunicación diaria, email para asuntos formales, WeChat solo para relaciones consolidadas. Skype y Zoom para reuniones por vídeo.
        - heading "13. Condiciones de pago y Trade Assurance" [level=2] [ref=f9e366]
        - paragraph [ref=f9e367]: "La mayoría de pérdidas de importadores no vienen de problemas de calidad, sino de proveedores fraudulentos. Niveles de seguridad recomendados:"
        - list [ref=f9e368]:
          - listitem [ref=f9e369]:
            - strong [ref=f9e370]: "Primer pedido (≤10.000 €):"
            - emphasis [ref=f9e371]: Alibaba Trade Assurance
            - text: . El dinero queda en Escrow hasta la recepción conforme. Protección hasta el 100% del importe.
          - listitem [ref=f9e372]:
            - strong [ref=f9e373]: "Socios consolidados (≤50.000 €):"
            - text: T/T 30/70 — 30% de anticipo tras firmar contrato, 70% contra copia del Bill of Lading (B/L). Es lo habitual entre proveedores con experiencia.
          - listitem [ref=f9e374]:
            - strong [ref=f9e375]: "Pedidos grandes (>50.000 €):"
            - text: Crédito documentario (L/C at sight) a través de un banco español. Máxima seguridad pero caro (0,3–0,5% de comisión bancaria) y 2–3 semanas de tramitación.
          - listitem [ref=f9e376]:
            - strong [ref=f9e377]: "Nunca:"
            - text: Western Union, MoneyGram, carteras anónimas. PayPal a proveedores chinos no es adecuado (la protección al comprador rara vez aplica en B2B).
        - heading "14. Señales de alerta — cuándo retirarse" [level=2] [ref=f9e378]
        - paragraph [ref=f9e379]: "Ciertos patrones son señales fiables de problemas. Si observas dos o más, abandona la negociación:"
        - list [ref=f9e380]:
          - listitem [ref=f9e381]: 🚩 El proveedor no envía la Business License a petición.
          - listitem [ref=f9e382]: 🚩 La membresía WPC no se puede verificar en la base de datos oficial.
          - listitem [ref=f9e383]: 🚩 Presión para anticipo grande (>30%) sin contrato firmado.
          - listitem [ref=f9e384]: 🚩 Precios 30–50% por debajo de la media del mercado para una especificación aparentemente idéntica.
          - listitem [ref=f9e385]: 🚩 Se evita o se aplaza repetidamente el vídeo de fábrica en vivo.
          - listitem [ref=f9e386]: 🚩 La muestra no llega en 14 días.
          - listitem [ref=f9e387]: 🚩 El Sales Manager cambia varias veces durante la negociación.
          - listitem [ref=f9e388]: 🚩 La DoC CE llega con errores gramaticales graves (señal de traducción automática sin revisión).
          - listitem [ref=f9e389]: 🚩 Promete AENOR o GS sin nombrar un laboratorio concreto (AENOR, TÜV Rheinland, VDE).
        - heading "15. Construir una relación a largo plazo" [level=2] [ref=f9e390]
        - paragraph [ref=f9e391]: Los proveedores más valiosos rara vez son los más baratos en el primer contacto. Un socio OEM consolidado ahorra el 15–25% del coste total a 3 años por menor tasa de defectos, iteración más rápida, condiciones de pago mejores y prioridad ante cuellos de botella de capacidad.
        - paragraph [ref=f9e392]:
          - strong [ref=f9e393]: "Qué caracteriza una verdadera asociación:"
        - list [ref=f9e394]:
          - listitem [ref=f9e395]: Account manager fijo durante al menos 12 meses
          - listitem [ref=f9e396]: Reuniones trimestrales sobre la hoja de ruta (nuevos modelos, evolución de precios, tendencias de mercado)
          - listitem [ref=f9e397]: Aviso previo en cuellos de capacidad y crisis de componentes (por ejemplo, la escasez de GaN-FET en 2024)
          - listitem [ref=f9e398]: Disposición a hacer ajustes técnicos sin recargo de moldes
          - listitem [ref=f9e399]: Desglose transparente del BOM en pedidos grandes
        - paragraph [ref=f9e400]:
          - text: WOWOHCOOL atiende a más de 200 marcas en 40 países, con 35+ relaciones de más de 5 años. Más detalles en nuestra
          - link "guía de fabricantes de power banks en China" [ref=f9e401] [cursor=pointer]:
            - /url: /es/blog/fabricante-power-banks-china-oem/
          - text: .
        - 'img "Línea de producción en fábrica de cargadores Shenzhen: montaje y ensamblaje con control de calidad en proceso para OEM/ODM | WOWOHCOOL" [ref=f9e402]'
        - heading "Conclusión para importadores hispanohablantes" [level=2] [ref=f9e403]
        - paragraph [ref=f9e404]: La elección de la fábrica adecuada de cargadores en China determina el éxito a largo plazo de tu marca propia. Invierte 4–6 semanas en el proceso de selección — esa inversión se amortiza durante años en menor tasa de defectos, suministros estables y márgenes previsibles.
        - paragraph [ref=f9e405]: "El proceso en la práctica: (1) preselecciona 5 proveedores comprobando Business License y base de datos WPC, (2) invita a 3 a auditoría por vídeo, (3) pide muestras a los 2 mejores, (4) cierra con el ganador un pedido piloto (500–1.000 unidades) usando Trade Assurance, (5) tras el éxito pasa a T/T 30/70 y series grandes."
