    - generic [ref=e76]:
      - heading "What Is a 3-in-1 Wireless Charging Station?" [level=2] [ref=e77]
      - paragraph [ref=e78]:
        - text: A 3-in-1 wireless charging station simultaneously powers three devices — phone, smartwatch, and earbuds — from a single desktop dock. Built around the Qi2 MPP (Magnetic Power Profile) standard with N52H neodymium magnets, modern 3-in-1 stations deliver 15W-25W fast charging with perfect magnetic alignment. For B2B buyers, the 3-in-1 category commands the
        - strong [ref=e79]: highest ASP in wireless charging
        - text: ($50-150 retail), accounting for 18-25% of unit volume but 40-50% of category revenue.
      - blockquote [ref=e80]:
        - paragraph [ref=e81]: "\"The global wireless charger market was valued at $6.78 billion in 2025 and is projected to reach $19.03 billion by 2030, growing at a 22.9% CAGR. Within this market, multi-device charging stations represent the highest-value segment — 60% of iPhone users also own an Apple Watch, 33% own AirPods, and 12% own all three devices. This 'Triple Threat' user base of approximately 170 million people represents the core addressable market for 3-in-1 charging stations.\""
        - generic [ref=e82]:
          - text: —
          - link "Grand View Research" [ref=e83] [cursor=pointer]:
            - /url: https://www.grandviewresearch.com/industry-analysis/wireless-charger-market-report
